<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Portal — Properties in Kenya</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f4f4f4; color: #111; }
    header {
      background: white;
      padding: 16px 20px;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    h1 { font-size: 20px; }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-primary { background: #0070f3; color: white; }
    .btn-success { background: #10b981; color: white; }
    .btn-warning { background: #f59e0b; color: white; }
    .btn-outline { background: transparent; border: 1px solid #0070f3; color: #0070f3; }
    .btn-logout { background: #6b7280; color: white; }
    .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
    .auth-box {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      max-width: 420px;
      margin: 0 auto;
    }
    .auth-box input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 16px;
    }
    .form-card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }
    .form-card input, .form-card textarea, .form-card select {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 16px;
    }
    .form-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .form-row > * { flex: 1 1 220px; }
    .card {
      background: white;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
    }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-approved { background: #d1fae5; color: #065f46; }
    .status-rejected { background: #fee2e2; color: #991b1b; }
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-content {
      background: white; padding: 25px; border-radius: 10px;
      width: 90%; max-width: 420px;
    }
    .error { color: #ef4444; margin-top: 8px; font-size: 14px; }
    button:disabled { opacity: 0.7; cursor: not-allowed; }
  </style>
</head>
<body>
<header>
  <h1>🏡 Agent Portal</h1>
  <div>
    <span id="agentEmail" style="margin-right: 15px; font-size:14px; color:#555;"></span>
    <button id="logoutBtn" class="btn-logout" style="display:none;" onclick="logout()">Logout</button>
  </div>
</header>

<div class="container">
  <!-- Auth -->
  <div id="authBox" class="auth-box">
    <h2 id="authTitle">Agent Login</h2>
    <input type="email" id="email" placeholder="Email" autocomplete="email">
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    <input type="text" id="fullName" placeholder="Full Name" style="display:none;">
    <button class="btn-primary" id="authSubmitBtn" onclick="handleAuth()">Log in</button>
    <p id="authError" class="error"></p>
    <p style="margin-top:15px; text-align:center;">
      <span id="toggleText">Don't have an account?</span>
      <span class="toggle-link" id="toggleAuthMode" onclick="toggleMode()" style="color:#0070f3; cursor:pointer;">Sign up</span>
    </p>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" style="display:none;">
    <div class="form-card">
      <h3>Account Status</h3>
      <p id="subscriptionStatus" style="font-size:15px;"></p>
      <button id="subscribeBtn" class="btn-warning" onclick="showSubscribeModal()" style="display:none; margin-top:10px;">
        💎 Subscribe – KES 1,000/month
      </button>
    </div>

    <div class="form-card">
      <h3>Submit New Property</h3>
      <div class="form-row">
        <input type="text" id="title" placeholder="Property Title" required>
        <input type="number" id="price" placeholder="Price (KES)" required>
      </div>
      <input type="text" id="location" placeholder="Location (e.g. Ruai Phase 5)" required>
      <div class="form-row">
        <select id="propertyType">
          <option value="">Property Type</option>
          <option value="for sale">For Sale</option>
          <option value="for rent">For Rent</option>
        </select>
        <input type="text" id="imageUrl" placeholder="Main Image URL (optional)">
      </div>
      <textarea id="description" rows="4" placeholder="Description (optional)"></textarea>
      <button class="btn-success" onclick="submitProperty()" style="width:100%; margin-top:10px;">Submit for Approval</button>
      <p id="submitMsg" class="error"></p>
    </div>

    <h3 style="margin: 20px 0 12px;">My Listings</h3>
    <div id="myListings"></div>
  </div>
</div>

<!-- Modals -->
<div id="subscribeModal" class="modal-overlay">
  <div class="modal-content">
    <h3>💎 Monthly Subscription – KES 1,000</h3>
    <input type="tel" id="subscribePhone" placeholder="M-Pesa Number (0712345678)">
    <button class="btn-warning" id="subscribePayBtn" onclick="handleSubscribePayment()" style="width:100%; margin:10px 0;">Send M-Pesa Request</button>
    <button class="btn-outline" onclick="closeSubscribeModal()" style="width:100%;">Cancel</button>
    <p id="subscribeMsg" class="error"></p>
  </div>
</div>

<script>
  const supabaseUrl = "https://nqwvsmuvltbiekfnvovx.supabase.co";
  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xd3ZzbXV2bHRiaWVrZm52b3Z4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjU4MDAsImV4cCI6MjA5NjE0MTgwMH0.Xrc-bbAuWdvKSPHnVhTaLiQphV61xeYtDepWePqsrdo";
  const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

  let currentUser = null;
  let isSignUp = false;

  // DOM
  const authBox = document.getElementById("authBox");
  const dashboard = document.getElementById("dashboard");
  const authTitle = document.getElementById("authTitle");
  const authError = document.getElementById("authError");
  const toggleText = document.getElementById("toggleText");
  const toggleAuthMode = document.getElementById("toggleAuthMode");
  const fullNameInput = document.getElementById("fullName");
  const agentEmailSpan = document.getElementById("agentEmail");
  const logoutBtn = document.getElementById("logoutBtn");
  const submitMsg = document.getElementById("submitMsg");

  window.toggleMode = function() {
    isSignUp = !isSignUp;
    if (isSignUp) {
      authTitle.textContent = "Agent Sign Up";
      document.getElementById("authSubmitBtn").textContent = "Create Account";
      toggleText.textContent = "Already have an account?";
      toggleAuthMode.textContent = "Log in";
      fullNameInput.style.display = "block";
    } else {
      authTitle.textContent = "Agent Login";
      document.getElementById("authSubmitBtn").textContent = "Log in";
      toggleText.textContent = "Don't have an account?";
      toggleAuthMode.textContent = "Sign up";
      fullNameInput.style.display = "none";
    }
    authError.textContent = "";
  };

  window.handleAuth = async function() {
    authError.textContent = "";
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const fullName = fullNameInput.value.trim();

    if (!email || !password) return authError.textContent = "Email and password required.";

    if (isSignUp) {
      if (!fullName) return authError.textContent = "Full name required.";
      const { data, error } = await supabaseClient.auth.signUp({
        email, password,
        options: { data: { full_name: fullName, role: 'agent' } }
      });
      if (error) return authError.textContent = error.message;
      authError.style.color = "green";
      authError.textContent = "Account created! Check email to confirm (if required).";
    } else {
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) return authError.textContent = error.message;
      await checkAgentAndShow();
    }
  };

  async function checkAgentAndShow() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) return;

    const { data: profile } = await supabaseClient
      .from("profiles")
      .select("role, full_name, subscribed, subscribed_until")
      .eq("id", user.id)
      .single();

    if (!profile || profile.role !== "agent") {
      await supabaseClient.auth.signOut();
      authError.textContent = "Access denied.";
      return;
    }

    currentUser = user;
    authBox.style.display = "none";
    dashboard.style.display = "block";
    logoutBtn.style.display = "inline-block";
    agentEmailSpan.textContent = user.email;

    const subStatus = document.getElementById("subscriptionStatus");
    const subBtn = document.getElementById("subscribeBtn");
    if (profile.subscribed && new Date(profile.subscribed_until) > new Date()) {
      subStatus.innerHTML = `✅ Subscribed until <strong>${new Date(profile.subscribed_until).toLocaleDateString()}</strong>`;
      subBtn.style.display = "none";
    } else {
      subStatus.textContent = "⏳ Not subscribed. Subscribe to list unlimited properties.";
      subBtn.style.display = "inline-block";
    }

    loadMyListings();
  }

  async function loadMyListings() {
    const container = document.getElementById("myListings");
    container.innerHTML = "Loading your listings...";

    const { data, error } = await supabaseClient
      .from("properties")
      .select("*")
      .eq("agent_id", currentUser.id)
      .order("created_at", { ascending: false });

    if (error || !data) return container.innerHTML = `<p style="color:red;">Error loading listings.</p>`;

    if (data.length === 0) {
      container.innerHTML = "<p>You have no listings yet. Submit one above.</p>";
      return;
    }

    container.innerHTML = data.map(p => `
      <div class="card">
        <h3>${p.title} <span class="status-badge status-${p.approval_status}">${p.approval_status.toUpperCase()}</span></h3>
        <p>${p.location} • KSh ${Number(p.price).toLocaleString()}</p>
        ${p.approval_status === 'approved' ? `<button class="btn-primary" onclick="alert('Feature coming soon - KES 500')">⭐ Feature Listing</button>` : ''}
      </div>
    `).join('');
  }

  window.submitProperty = async function() {
    if (!currentUser) return alert("Please log in.");
    submitMsg.textContent = "";

    const title = document.getElementById("title").value.trim();
    const price = document.getElementById("price").value;
    const location = document.getElementById("location").value.trim();
    const propertyType = document.getElementById("propertyType").value;
    const imageUrl = document.getElementById("imageUrl").value.trim();
    const description = document.getElementById("description").value.trim();

    if (!title || !price || !location || !propertyType) {
      submitMsg.textContent = "Title, Price, Location and Type are required.";
      return;
    }

    const { error } = await supabaseClient.from("properties").insert([{
      title, price: parseFloat(price), location, property_type: propertyType,
      image_url: imageUrl || null, description,
      approval_status: "pending", agent_id: currentUser.id
    }]);

    if (error) {
      submitMsg.textContent = "Error: " + error.message;
      return;
    }

    submitMsg.style.color = "green";
    submitMsg.textContent = "✅ Property submitted for approval!";
    loadMyListings();

    // Clear form
    document.getElementById("title").value = "";
    document.getElementById("price").value = "";
    document.getElementById("location").value = "";
    document.getElementById("propertyType").value = "";
    document.getElementById("imageUrl").value = "";
    document.getElementById("description").value = "";
  };

  // M-Pesa (placeholder - needs working Edge Function)
  window.showSubscribeModal = () => document.getElementById("subscribeModal").style.display = "flex";
  window.closeSubscribeModal = () => document.getElementById("subscribeModal").style.display = "none";

  window.handleSubscribePayment = async function() {
    const phone = document.getElementById("subscribePhone").value.trim();
    if (!phone) return document.getElementById("subscribeMsg").textContent = "Enter M-Pesa number";

    const msgEl = document.getElementById("subscribeMsg");
    const btn = document.getElementById("subscribePayBtn");
    btn.disabled = true;
    btn.textContent = "Sending...";

    try {
      // This is where the critical Edge Function is called
      const { data, error } = await supabaseClient.functions.invoke('mpesa-stk', {
        body: { phone, amount: 1000, payment_type: "subscription", agent_id: currentUser.id }
      });

      if (error) throw error;
      msgEl.style.color = "green";
      msgEl.textContent = "✅ M-Pesa request sent! Check your phone.";
      setTimeout(() => closeSubscribeModal(), 4000);
    } catch (err) {
      msgEl.textContent = "❌ " + (err.message || "Failed to send request.");
    } finally {
      btn.disabled = false;
      btn.textContent = "Send M-Pesa Request";
    }
  };

  window.logout = async () => {
    await supabaseClient.auth.signOut();
    currentUser = null;
    authBox.style.display = "block";
    dashboard.style.display = "none";
    logoutBtn.style.display = "none";
  };

  // Init
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session?.user) await checkAgentAndShow();
    else authBox.style.display = "block";
  })();
</script>
</body>
</html>
