<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Properties - Properties in Kenya</title>
    <!-- NOTE: For production, replace this CDN with a pre-compiled Tailwind CSS file -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
        body { font-family: 'Inter', system_ui, sans-serif; }
        .heading-font { font-family: 'Space Grotesk', sans-serif; }
        .sidebar-link.active { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; }
        .sidebar-link:hover:not(.active) { background-color: #fef3c7; color: #d97706; }
        @media (max-width: 1024px) { .sidebar { display: none; } .sidebar.mobile-open { display: block; } }
        .modal { animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes modalPop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="bg-gray-50">

<button id="mobile-menu-btn" class="lg:hidden fixed top-4 left-4 z-50 bg-white p-3 rounded-xl shadow-lg" aria-label="Toggle menu">
    <i class="fas fa-bars text-gray-700"></i>
</button>
<div id="mobile-overlay" class="hidden lg:hidden fixed inset-0 bg-black/50 z-40"></div>

<div class="flex min-h-screen">
    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar fixed lg:sticky top-0 left-0 h-screen w-72 bg-white border-r border-gray-200 z-40 overflow-y-auto">
        <div class="p-6 border-b border-gray-200">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-amber-400 to-yellow-600 rounded-xl flex items-center justify-center text-white font-bold text-xl">🏠</div>
                <div><h1 class="heading-font text-xl font-bold">RealtorOS</h1><p class="text-xs text-gray-500">Agent Dashboard</p></div>
            </div>
        </div>
        <nav class="p-4 space-y-1">
            <a href="agent-dashboard.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-700"><i class="fas fa-chart-line w-5"></i> Dashboard</a>
            <a href="agent-properties.html" class="sidebar-link active flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium"><i class="fas fa-building w-5"></i> Properties</a>
            <a href="shared-listings.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-700"><i class="fas fa-share-nodes w-5"></i> Shared Listings</a>
            <a href="buyer-requests.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-700"><i class="fas fa-user-tie w-5"></i> Buyer Requests</a>
            <a href="lead-center.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-700"><i class="fas fa-bullseye w-5"></i> Lead Center</a>
            <a href="agent-network.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-700"><i class="fas fa-users w-5"></i> Agent Network</a>
            <a href="messages.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-700"><i class="fas fa-comment-dots w-5"></i> Messages</a>
            <a href="commissions.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-700"><i class="fas fa-wallet w-5"></i> Commissions</a>
            <div class="pt-4 mt-4 border-t border-gray-200">
                <a href="#" id="logout-btn" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-700"><i class="fas fa-sign-out-alt w-5"></i> Logout</a>
            </div>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 lg:ml-0 w-full">
        <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
            <div class="px-6 py-4 flex items-center justify-between">
                <div class="lg:pl-0 pl-12">
                    <h1 class="heading-font text-2xl font-bold">My Properties</h1>
                    <p class="text-sm text-gray-500">Manage your listings and co-broker settings</p>
                </div>
                <button id="add-property-btn" class="flex items-center gap-2 bg-gradient-to-r from-amber-500 to-yellow-600 text-white px-4 py-2.5 rounded-xl font-semibold text-sm hover:shadow-lg transition">
                    <i class="fas fa-plus"></i> Add Property
                </button>
            </div>
        </header>

        <div class="p-6">
            <!-- Filters -->
            <div class="bg-white p-4 rounded-2xl border border-gray-100 mb-6 flex flex-col sm:flex-row gap-4">
                <div class="flex-1 relative">
                    <i class="fas fa-search absolute left-4 top-3.5 text-gray-400"></i>
                    <input type="text" id="search-input" placeholder="Search by title or location..." class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <select id="filter-status" class="px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 bg-white">
                    <option value="all">All Statuses</option>
                    <option value="available">Available</option>
                    <option value="pending">Pending</option>
                    <option value="reserved">Reserved</option>
                    <option value="sold">Sold</option>
                </select>
                <select id="filter-visibility" class="px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 bg-white">
                    <option value="all">All Visibility</option>
                    <option value="private">Private</option>
                    <option value="public">Public</option>
                    <option value="co-broker">Co-Broker Friendly</option>
                </select>
            </div>

            <!-- Properties Grid -->
            <div id="properties-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                <div class="col-span-full text-center py-12 text-gray-400">
                    <i class="fas fa-spinner fa-spin text-3xl mb-3"></i>
                    <p>Loading your properties...</p>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- ADD/EDIT PROPERTY MODAL -->
<div id="property-modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-50 p-4">
    <div class="modal bg-white rounded-3xl w-full max-w-3xl max-h-[90vh] overflow-y-auto">
        <div class="p-6 border-b flex items-center justify-between sticky top-0 bg-white z-10">
            <h2 class="heading-font text-xl font-bold" id="modal-title">Add New Property</h2>
            <button id="close-modal-btn" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100"><i class="fas fa-times text-xl"></i></button>
        </div>
        
        <form id="property-form" class="p-6 space-y-6">
            <input type="hidden" id="prop-id">
            
            <!-- Basic Info -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="md:col-span-2">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Property Title</label>
                    <input type="text" id="prop-title" required maxlength="100" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none" placeholder="e.g., 4 Bedroom Maisonette in Lavington">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Price (KES)</label>
                    <input type="number" id="prop-price" required min="0" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none" placeholder="32000000">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Property Type</label>
                    <select id="prop-type" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none bg-white">
                        <option>Apartment</option><option>Maisonette</option><option>Villa</option><option>Townhouse</option><option>Land</option><option>Commercial</option>
                    </select>
                </div>
            </div>

            <!-- Location -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">County</label>
                    <select id="prop-county" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none bg-white">
                        <option>Nairobi</option><option>Kiambu</option><option>Kajiado</option><option>Mombasa</option><option>Nakuru</option><option>Machakos</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Town/Area</label>
                    <input type="text" id="prop-town" maxlength="50" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none" placeholder="e.g., Lavington">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Specific Location</label>
                    <input type="text" id="prop-location" maxlength="100" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none" placeholder="e.g., Near Junction Mall">
                </div>
            </div>

            <!-- Details -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Bedrooms</label>
                    <input type="number" id="prop-beds" min="0" max="20" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none" placeholder="4">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Bathrooms</label>
                    <input type="number" id="prop-baths" min="0" max="20" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none" placeholder="3">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Status</label>
                    <select id="prop-status" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none bg-white">
                        <option value="available">Available</option><option value="pending">Pending</option><option value="reserved">Reserved</option><option value="sold">Sold</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Visibility</label>
                    <select id="prop-visibility" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none bg-white">
                        <option value="private">Private (Only Me)</option>
                        <option value="public">Public (Buyers can see)</option>
                        <option value="co-broker">Co-Broker Friendly (Agents can see)</option>
                    </select>
                </div>
            </div>

            <!-- Collaboration Settings -->
            <div id="collab-settings" class="hidden bg-amber-50 p-4 rounded-xl border border-amber-200">
                <h3 class="font-semibold text-amber-800 mb-2"><i class="fas fa-handshake mr-2"></i>Co-Broker Settings</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-amber-900 mb-1">Commission Split for Marketing Agent (%)</label>
                        <input type="number" id="prop-commission" value="50" min="0" max="100" class="w-full px-4 py-2 border border-amber-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-amber-900 mb-1">Agent Notes (Private)</label>
                        <input type="text" id="prop-notes" maxlength="200" class="w-full px-4 py-2 border border-amber-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none" placeholder="e.g., Seller is flexible on price">
                    </div>
                </div>
            </div>

            <!-- Description & Images -->
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Description</label>
                    <textarea id="prop-description" rows="3" maxlength="1000" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none" placeholder="Describe the property features..."></textarea>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Main Image URL</label>
                    <input type="url" id="prop-image" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none" placeholder="https://example.com/image.jpg">
                    <p class="text-xs text-gray-500 mt-1">Paste a valid HTTP/HTTPS image URL.</p>
                </div>
            </div>

            <div class="flex gap-4 pt-4 border-t">
                <button type="button" id="cancel-modal-btn" class="flex-1 py-3 border border-gray-300 rounded-xl font-semibold hover:bg-gray-50">Cancel</button>
                <button type="submit" id="save-property-btn" class="flex-1 py-3 bg-gradient-to-r from-amber-500 to-yellow-600 text-white rounded-xl font-semibold hover:shadow-lg">Save Property</button>
            </div>
        </form>
    </div>
</div>

<script>
(function() {
    'use strict';

    // ==========================================
    // 1. CONFIGURATION & STATE
    // ==========================================
    const supabase = window.supabase.createClient(
        'https://nqvsmuvltbiekfnvovx.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xd3ZzbXV2bHRiaWVrZm52b3Z4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjU4MDAsImV4cCI6MjA5NjE0MTgwMH0.Xrc-bbAuWdvKSPHnVhTaLiQphV61xeYtDepWePqsrdo'
    );

    const FALLBACK_IMG = 'https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=800&auto=format&fit=crop';
    
    const state = {
        user: null,
        allProperties: [],
        searchTimeout: null
    };

    // ==========================================
    // 2. UTILITIES
    // ==========================================
    function esc(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function isValidUrl(string) {
        try {
            const url = new URL(string);
            return url.protocol === 'http:' || url.protocol === 'https:';
        } catch (_) {
            return false;
        }
    }

    function formatKES(amount) {
        return new Intl.NumberFormat('en-KE', { style: 'currency', currency: 'KES', maximumFractionDigits: 0 }).format(amount || 0);
    }

    function debounce(func, wait) {
        return (...args) => {
            clearTimeout(state.searchTimeout);
            state.searchTimeout = setTimeout(() => func.apply(this, args), wait);
        };
    }

    // ==========================================
    // 3. AUTH & DATA LOADING
    // ==========================================
    async function checkAuth() {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) { 
            window.location.href = 'login.html'; 
            return; 
        }
        state.user = user;
        loadProperties();
    }

    async function loadProperties() {
        const grid = document.getElementById('properties-grid');
        try {
            const { data, error } = await supabase
                .from('properties')
                .select('*')
                .eq('agent_id', state.user.id) // 🔒 SECURITY: Explicit ownership check
                .order('created_at', { ascending: false });

            if (error) throw error;
            state.allProperties = data || [];
            applyFilters(); // Render with current filters
        } catch (err) {
            console.error(err);
            grid.innerHTML = `<div class="col-span-full text-center text-red-500 py-8">Error loading properties. Please try again.</div>`;
        }
    }

    // ==========================================
    // 4. RENDERING & FILTERING
    // ==========================================
    function applyFilters() {
        const search = document.getElementById('search-input').value.toLowerCase();
        const status = document.getElementById('filter-status').value;
        const visibility = document.getElementById('filter-visibility').value;

        const filtered = state.allProperties.filter(prop => {
            const matchesSearch = !search || 
                (prop.title && prop.title.toLowerCase().includes(search)) || 
                (prop.town && prop.town.toLowerCase().includes(search)) || 
                (prop.county && prop.county.toLowerCase().includes(search));
            const matchesStatus = status === 'all' || prop.status === status;
            const matchesVisibility = visibility === 'all' || prop.visibility === visibility;
            return matchesSearch && matchesStatus && matchesVisibility;
        });

        renderProperties(filtered);
    }

    function renderProperties(properties) {
        const grid = document.getElementById('properties-grid');
        if (properties.length === 0) {
            grid.innerHTML = `
                <div class="col-span-full text-center py-12">
                    <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-building text-3xl text-gray-400"></i>
                    </div>
                    <h3 class="text-lg font-semibold text-gray-700">No properties found</h3>
                    <p class="text-gray-500 mb-4">Start by adding your first listing.</p>
                    <button id="empty-add-btn" class="bg-amber-500 text-white px-6 py-2 rounded-xl font-semibold">Add Property</button>
                </div>`;
            
            document.getElementById('empty-add-btn').addEventListener('click', openPropertyModal);
            return;
        }

        const visibilityColors = { 'private': 'bg-gray-100 text-gray-700', 'public': 'bg-blue-100 text-blue-700', 'co-broker': 'bg-amber-100 text-amber-700' };
        const statusColors = { 'available': 'bg-green-100 text-green-700', 'pending': 'bg-yellow-100 text-yellow-700', 'reserved': 'bg-purple-100 text-purple-700', 'sold': 'bg-red-100 text-red-700' };

        grid.innerHTML = properties.map(prop => {
            const imgSrc = (prop.images && prop.images[0] && isValidUrl(prop.images[0])) ? prop.images[0] : FALLBACK_IMG;
            const commissionBadge = prop.visibility === 'co-broker' && prop.commission_split 
                ? `<div class="absolute top-3 right-3 bg-amber-500 text-white px-3 py-1 rounded-full text-xs font-bold"><i class="fas fa-percentage mr-1"></i>${prop.commission_split}% Split</div>` 
                : '';

            return `
            <div class="bg-white rounded-2xl border border-gray-100 overflow-hidden hover:shadow-xl transition-shadow duration-300 group">
                <div class="relative h-48 bg-gray-200">
                    <img src="${esc(imgSrc)}" class="prop-img w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" alt="Property">
                    <div class="absolute top-3 left-3 flex gap-2">
                        <span class="px-3 py-1 rounded-full text-xs font-bold uppercase ${visibilityColors[prop.visibility] || 'bg-gray-100'}">${esc(prop.visibility)}</span>
                        <span class="px-3 py-1 rounded-full text-xs font-bold uppercase ${statusColors[prop.status] || 'bg-gray-100'}">${esc(prop.status)}</span>
                    </div>
                    ${commissionBadge}
                </div>
                <div class="p-5">
                    <h3 class="font-bold text-lg text-gray-900 mb-1 line-clamp-1">${esc(prop.title)}</h3>
                    <p class="text-sm text-gray-500 mb-3"><i class="fas fa-map-marker-alt mr-1 text-amber-500"></i> ${esc(prop.town || prop.county)}, ${esc(prop.county)}</p>
                    
                    <div class="flex items-center gap-4 text-sm text-gray-600 mb-4">
                        ${prop.bedrooms ? `<span><i class="fas fa-bed mr-1"></i> ${prop.bedrooms} Beds</span>` : ''}
                        ${prop.bathrooms ? `<span><i class="fas fa-bath mr-1"></i> ${prop.bathrooms} Baths</span>` : ''}
                        <span><i class="fas fa-home mr-1"></i> ${esc(prop.property_type)}</span>
                    </div>

                    <div class="flex items-center justify-between pt-4 border-t border-gray-100">
                        <span class="text-xl font-bold text-amber-600">${formatKES(prop.price)}</span>
                        <div class="flex gap-2">
                            <button class="btn-edit w-9 h-9 flex items-center justify-center rounded-lg bg-gray-100 text-gray-600 hover:bg-blue-100 hover:text-blue-600 transition" data-id="${esc(prop.id)}" aria-label="Edit property"><i class="fas fa-pen"></i></button>
                            <button class="btn-delete w-9 h-9 flex items-center justify-center rounded-lg bg-gray-100 text-gray-600 hover:bg-red-100 hover:text-red-600 transition" data-id="${esc(prop.id)}" aria-label="Delete property"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    // ==========================================
    // 5. MODAL & FORM HANDLING
    // ==========================================
    function openPropertyModal() {
        document.getElementById('property-form').reset();
        document.getElementById('prop-id').value = '';
        document.getElementById('modal-title').textContent = 'Add New Property';
        document.getElementById('collab-settings').classList.add('hidden');
        document.getElementById('property-modal').classList.remove('hidden');
    }

    function closePropertyModal() {
        document.getElementById('property-modal').classList.add('hidden');
    }

    function editProperty(prop) {
        document.getElementById('prop-id').value = prop.id;
        document.getElementById('modal-title').textContent = 'Edit Property';
        document.getElementById('prop-title').value = prop.title || '';
        document.getElementById('prop-price').value = prop.price || '';
        document.getElementById('prop-type').value = prop.property_type || 'Apartment';
        document.getElementById('prop-county').value = prop.county || 'Nairobi';
        document.getElementById('prop-town').value = prop.town || '';
        document.getElementById('prop-location').value = prop.location || '';
        document.getElementById('prop-beds').value = prop.bedrooms || '';
        document.getElementById('prop-baths').value = prop.bathrooms || '';
        document.getElementById('prop-status').value = prop.status || 'available';
        document.getElementById('prop-visibility').value = prop.visibility || 'private';
        document.getElementById('prop-commission').value = prop.commission_split || 50;
        document.getElementById('prop-notes').value = prop.agent_notes || '';
        document.getElementById('prop-description').value = prop.description || '';
        
        const imgUrl = (prop.images && prop.images[0] && isValidUrl(prop.images[0])) ? prop.images[0] : '';
        document.getElementById('prop-image').value = imgUrl;

        if (prop.visibility === 'co-broker') {
            document.getElementById('collab-settings').classList.remove('hidden');
        } else {
            document.getElementById('collab-settings').classList.add('hidden');
        }
        
        document.getElementById('property-modal').classList.remove('hidden');
    }

    async function handleFormSubmit(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('save-property-btn');
        
        // Validation
        const price = parseFloat(document.getElementById('prop-price').value);
        if (isNaN(price) || price < 0) {
            alert('Please enter a valid positive number for the price.');
            return;
        }

        const imgUrl = document.getElementById('prop-image').value.trim();
        if (imgUrl && !isValidUrl(imgUrl)) {
            alert('Please enter a valid HTTP or HTTPS image URL.');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Saving...';

        const propData = {
            agent_id: state.user.id,
            title: document.getElementById('prop-title').value.trim(),
            price: price,
            property_type: document.getElementById('prop-type').value,
            county: document.getElementById('prop-county').value,
            town: document.getElementById('prop-town').value.trim(),
            location: document.getElementById('prop-location').value.trim(),
            bedrooms: parseInt(document.getElementById('prop-beds').value) || null,
            bathrooms: parseInt(document.getElementById('prop-baths').value) || null,
            status: document.getElementById('prop-status').value,
            visibility: document.getElementById('prop-visibility').value,
            commission_split: parseFloat(document.getElementById('prop-commission').value) || 50,
            agent_notes: document.getElementById('prop-notes').value.trim(),
            description: document.getElementById('prop-description').value.trim(),
            images: imgUrl ? [imgUrl] : []
        };

        const propId = document.getElementById('prop-id').value;
        let error;

        try {
            if (propId) {
                // 🔒 SECURITY: Explicit ownership check on update
                const res = await supabase.from('properties').update(propData).eq('id', propId).eq('agent_id', state.user.id);
                error = res.error;
            } else {
                const res = await supabase.from('properties').insert([propData]);
                error = res.error;
            }

            if (error) throw error;

            closePropertyModal();
            loadProperties();
        } catch (err) {
            console.error(err);
            alert('Error saving property: ' + err.message);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Save Property';
        }
    }

    async function deleteProperty(id) {
        if (!confirm('Are you sure you want to delete this property? This cannot be undone.')) return;
        
        try {
            // 🔒 SECURITY: Explicit ownership check on delete
            const { error } = await supabase.from('properties').delete().eq('id', id).eq('agent_id', state.user.id);
            if (error) throw error;
            loadProperties();
        } catch (err) {
            console.error(err);
            alert('Error deleting: ' + err.message);
        }
    }

    // ==========================================
    // 6. EVENT DELEGATION & INITIALIZATION
    // ==========================================
    function initEventListeners() {
        // Mobile Menu
        document.getElementById('mobile-menu-btn').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('mobile-open');
            document.getElementById('mobile-overlay').classList.toggle('hidden');
        });
        document.getElementById('mobile-overlay').addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('mobile-open');
            document.getElementById('mobile-overlay').classList.add('hidden');
        });

        // Logout
        document.getElementById('logout-btn').addEventListener('click', async (e) => {
            e.preventDefault();
            await supabase.auth.signOut();
            window.location.href = 'login.html';
        });

        // Modal Controls
        document.getElementById('add-property-btn').addEventListener('click', openPropertyModal);
        document.getElementById('close-modal-btn').addEventListener('click', closePropertyModal);
        document.getElementById('cancel-modal-btn').addEventListener('click', closePropertyModal);
        
        // Visibility Toggle
        document.getElementById('prop-visibility').addEventListener('change', function() {
            document.getElementById('collab-settings').classList.toggle('hidden', this.value !== 'co-broker');
        });

        // Form Submission
        document.getElementById('property-form').addEventListener('submit', handleFormSubmit);

        // Filters (Debounced)
        const debouncedFilter = debounce(applyFilters, 300);
        document.getElementById('search-input').addEventListener('input', debouncedFilter);
        document.getElementById('filter-status').addEventListener('change', applyFilters);
        document.getElementById('filter-visibility').addEventListener('change', applyFilters);

        // 🔒 SECURE EVENT DELEGATION for Property Cards
        document.getElementById('properties-grid').addEventListener('click', (e) => {
            const editBtn = e.target.closest('.btn-edit');
            if (editBtn) {
                const prop = state.allProperties.find(p => p.id === editBtn.dataset.id);
                if (prop) editProperty(prop);
                return;
            }

            const deleteBtn = e.target.closest('.btn-delete');
            if (deleteBtn) {
                deleteProperty(deleteBtn.dataset.id);
                return;
            }
        });

        // 🔒 GLOBAL IMAGE ERROR HANDLER (CSP Compliant)
        document.addEventListener('error', (e) => {
            if (e.target.tagName === 'IMG' && e.target.classList.contains('prop-img')) {
                e.target.src = FALLBACK_IMG;
            }
        }, true);
    }

    // Start App
    document.addEventListener('DOMContentLoaded', () => {
        initEventListeners();
        checkAuth();
    });

})();
</script>
</body>
</html>
