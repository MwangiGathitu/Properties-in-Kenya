<!DOCTYPE html>
<html>
<head>
  <title>Properties in Kenya</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f4f4f4;
    }

    header {
      padding: 20px;
      text-align: center;
      background: white;
      position: sticky;
      top: 0;
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    input, textarea {
      padding: 8px;
      margin: 5px;
      width: 200px;
    }

    button {
      padding: 8px 12px;
      margin: 5px;
      cursor: pointer;
    }

    #listings {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .content {
      padding: 10px;
    }

    .price {
      font-weight: bold;
      color: blue;
    }

    #detailView {
      display: none;
      padding: 20px;
    }

    .form-box {
      background: white;
      padding: 15px;
      margin: 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>Properties in Kenya</h1>
</header>

<!-- FORM -->
<div class="form-box">
  <h3>Submit Property</h3>

  <input id="title" placeholder="Title" />
  <input id="price" placeholder="Price" />
  <input id="location" placeholder="Location" />
  <input id="type" placeholder="Type (for sale / for rent)" />
  <input id="image" placeholder="Image URL" />
  <textarea id="desc" placeholder="Description"></textarea>

  <br>

  <button onclick="submitProperty()">Submit</button>
</div>

<!-- LISTINGS -->
<div id="listings"></div>

<!-- DETAIL -->
<div id="detailView"></div>

<script>
  const supabaseUrl = "https://nqwvsmuvltbiekfnvovx.supabase.co";
  const supabaseKey = "YOUR_SUPABASE_ANON_KEY";
  const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

  let allProperties = [];

  // LOAD ONLY APPROVED PROPERTIES
  async function loadProperties() {
    const { data, error } = await supabaseClient
      .from("properties")
      .select("*")
      .eq("approval_status", "approved");

    if (error) {
      console.error(error);
      return;
    }

    allProperties = data;
    render(data);
  }

  function render(data) {
    const container = document.getElementById("listings");
    container.innerHTML = "";

    data.forEach(p => {
      const card = document.createElement("div");
      card.className = "card";

      card.onclick = () => openProperty(p);

      const image = p.image_url || `https://picsum.photos/seed/${p.id}/400/300`;

      card.innerHTML = `
        <img src="${image}">
        <div class="content">
          <div class="price">KSh ${Number(p.price).toLocaleString()}</div>
          <div>${p.location}</div>
          <div>${p.property_type}</div>
        </div>
      `;

      container.appendChild(card);
    });
  }

  function openProperty(p) {
    const image = p.image_url || `https://picsum.photos/seed/${p.id}/800/500`;

    const msg = encodeURIComponent(
      `Hello, I am interested in ${p.title} in ${p.location}`
    );

    document.getElementById("listings").style.display = "none";
    document.getElementById("detailView").style.display = "block";

    document.getElementById("detailView").innerHTML = `
      <button onclick="closeDetail()">Back</button>

      <h2>${p.title}</h2>
      <img src="${image}" style="width:100%; max-height:400px; object-fit:cover;">

      <h3>KSh ${Number(p.price).toLocaleString()}</h3>
      <p>${p.description}</p>

      <a href="https://wa.me/254700000000?text=${msg}" target="_blank">
        WhatsApp Inquiry
      </a>
    `;
  }

  function closeDetail() {
    document.getElementById("detailView").style.display = "none";
    document.getElementById("listings").style.display = "grid";
  }

  // SUBMIT PROPERTY (CONTROLLED)
  async function submitProperty() {

    const { data: { user } } = await supabaseClient.auth.getUser();

    if (!user) {
      alert("You must be logged in");
      return;
    }

    const title = document.getElementById("title").value;
    const price = document.getElementById("price").value;
    const location = document.getElementById("location").value;
    const type = document.getElementById("type").value;
    const image = document.getElementById("image").value;
    const desc = document.getElementById("desc").value;

    const { error } = await supabaseClient
      .from("properties")
      .insert([{
        title,
        price,
        location,
        property_type: type,
        image_url: image,
        description: desc,
        approval_status: "pending",
        agent_id: user.id
      }]);

    if (error) {
      console.error(error);
      alert("Failed to submit");
      return;
    }

    alert("Submitted for approval");
    loadProperties();
  }

  loadProperties();
</script>

</body>
</html>
