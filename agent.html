<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealtorOS • AI Real Estate Agent Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
        
        body { font-family: 'Inter', system_ui, sans-serif; }
        .heading-font { font-family: 'Space Grotesk', sans-serif; }
        
        .card-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-hover:hover { transform: translateY(-6px); box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.15); }
        
        .pipeline-step { transition: all 0.3s; }
        .modal { animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes modalPop { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="bg-gray-50">

<!-- NAV -->
<nav class="fixed top-0 left-0 right-0 bg-white border-b z-50">
    <div class="max-w-screen-2xl mx-auto px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-x-8">
            <div class="flex items-center gap-x-3">
                <div class="w-9 h-9 bg-gradient-to-br from-amber-400 to-yellow-600 rounded-2xl flex items-center justify-center text-white font-bold text-2xl">🏠</div>
                <span class="heading-font text-3xl font-bold tracking-tighter">RealtorOS</span>
            </div>
        </div>
        <div class="flex items-center gap-x-8 text-sm font-medium">
            <button onclick="navigateTo('dashboard')" class="hover:text-amber-600">Dashboard</button>
            <button onclick="navigateTo('leads')" class="hover:text-amber-600">Leads</button>
            <button onclick="navigateTo('properties')" class="hover:text-amber-600">Properties</button>
            <button onclick="navigateTo('deals')" class="hover:text-amber-600">Deals</button>
        </div>
    </div>
</nav>

<div class="pt-20 max-w-screen-2xl mx-auto px-6">

    <!-- DASHBOARD (kept brief) -->
    <div id="dashboard-view" class="view">
        <!-- ... existing dashboard ... -->
    </div>

    <!-- ==================== LEADS VIEW WITH PIPELINE ==================== -->
    <div id="leads-view" class="view hidden">
        <div class="flex justify-between items-center mb-8">
            <h1 class="heading-font text-4xl font-semibold">Leads Pipeline</h1>
            <button onclick="showAddLeadModal()" class="bg-amber-600 text-white px-6 py-3 rounded-2xl flex items-center gap-x-2 font-semibold">
                <i class="fas fa-plus"></i> New Lead
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-5 gap-6" id="leads-pipeline">
            <!-- JS populated -->
        </div>

        <div class="mt-12 bg-white rounded-3xl p-8" id="all-leads-list">
            <!-- Detailed leads table populated by JS -->
        </div>
    </div>

    <!-- ==================== PROPERTY UPLOAD + AI MARKETING MODAL ==================== -->
    <div id="property-modal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center z-[100]">
        <div class="modal bg-white rounded-3xl max-w-2xl w-full mx-4 max-h-[90vh] overflow-auto">
            <div class="p-8 border-b flex items-center justify-between sticky top-0 bg-white">
                <h2 class="heading-font text-2xl font-semibold">Upload Property + AI Marketing</h2>
                <button onclick="closeModal()" class="text-3xl leading-none">×</button>
            </div>
            
            <div class="p-8 space-y-8">
                <div>
                    <label class="block text-sm font-medium mb-2">Property Photos</label>
                    <div class="border-2 border-dashed border-gray-300 rounded-2xl p-12 text-center cursor-pointer hover:border-amber-400"
                         onclick="document.getElementById('photo-upload').click()">
                        <i class="fas fa-cloud-upload-alt text-4xl text-gray-400 mb-3"></i>
                        <p class="font-medium">Drop photos or click to upload</p>
                        <input type="file" id="photo-upload" multiple accept="image/*" class="hidden">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium mb-2">Title</label>
                        <input id="prop-title" class="w-full border border-gray-300 rounded-2xl px-5 py-4" placeholder="4 Bedroom Maisonette in Lavington">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Price (KES)</label>
                        <input id="prop-price" type="number" class="w-full border border-gray-300 rounded-2xl px-5 py-4">
                    </div>
                </div>

                <button onclick="generateAIMarketing()" 
                        class="w-full bg-gradient-to-r from-amber-400 to-yellow-500 text-black font-semibold py-5 rounded-2xl text-lg flex items-center justify-center gap-x-3">
                    <i class="fas fa-wand-magic-sparkles"></i>
                    Generate AI Descriptions &amp; Marketing Content
                </button>

                <div id="ai-marketing-output" class="hidden space-y-6 bg-amber-50 p-6 rounded-2xl">
                    <!-- AI output populated here -->
                </div>
            </div>
            
            <div class="p-8 border-t flex gap-4">
                <button onclick="closeModal()" class="flex-1 py-4 border border-gray-300 rounded-2xl font-semibold">Cancel</button>
                <button onclick="saveProperty()" class="flex-1 py-4 bg-amber-600 text-white rounded-2xl font-semibold">Publish Everywhere</button>
            </div>
        </div>
    </div>

    <!-- ==================== DEAL ROOM ==================== -->
    <div id="deal-room-modal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center z-[100]">
        <div class="modal bg-white rounded-3xl w-full max-w-4xl mx-4 max-h-[92vh] overflow-hidden flex flex-col">
            <div class="p-8 border-b flex items-center justify-between bg-gradient-to-r from-amber-50 to-white">
                <div>
                    <h2 class="heading-font text-2xl font-bold" id="deal-title">Deal Room - Lavington Maisonette</h2>
                    <p class="text-sm text-gray-500" id="deal-parties">Buyer: Jane Wanjiku • Seller: Peter Kimani</p>
                </div>
                <div class="text-right">
                    <div class="text-emerald-600 font-bold text-3xl" id="deal-progress">68%</div>
                    <div class="text-xs tracking-widest">COMPLETE</div>
                </div>
            </div>

            <div class="flex-1 overflow-auto p-8">
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                    <!-- Left Column: Timeline -->
                    <div class="lg:col-span-7 space-y-8">
                        <h3 class="font-semibold text-lg flex items-center gap-x-2"><i class="fas fa-timeline"></i> Deal Progress</h3>
                        <div id="deal-timeline" class="space-y-6">
                            <!-- JS populated -->
                        </div>
                    </div>
                    
                    <!-- Right Column: Documents & Chat -->
                    <div class="lg:col-span-5 space-y-8">
                        <div>
                            <h4 class="font-medium mb-4">Documents</h4>
                            <div class="space-y-3" id="deal-docs"></div>
                        </div>
                        
                        <div>
                            <h4 class="font-medium mb-3">AI Negotiation Assistant</h4>
                            <textarea id="negotiation-input" class="w-full border rounded-2xl p-4 h-32" placeholder="Client said price is too high..."></textarea>
                            <button onclick="getAINegotiationAdvice()" class="mt-3 w-full bg-black text-white py-4 rounded-2xl">Get AI Suggestion</button>
                            <div id="ai-negotiation-response" class="mt-4 text-sm bg-gray-50 p-4 rounded-2xl hidden"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="p-6 border-t flex gap-3">
                <button onclick="closeDealRoom()" class="flex-1 py-4 border rounded-2xl">Close Room</button>
                <button onclick="advanceDealStage()" class="flex-1 py-4 bg-emerald-600 text-white rounded-2xl">Mark Next Stage Complete</button>
            </div>
        </div>
    </div>

</div>

<script>
// Supabase Client
const supabase = supabase.createClient(
    'https://nqwvsmuvltbiekfnvovx.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xd3ZzbXV2bHRiaWVrZm52b3Z4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjU4MDAsImV4cCI6MjA5NjE0MTgwMH0.Xrc-bbAuWdvKSPHnVhTaLiQphV61xeYtDepWePqsrdo'
);

// Navigation
function navigateTo(view) {
    document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
    const target = document.getElementById(view + '-view');
    if (target) target.classList.remove('hidden');
}

// ==================== LEADS PIPELINE ====================
async function loadLeadsPipeline() {
    const stages = [
        { id: 'new', name: 'New Leads', count: 18, color: 'gray' },
        { id: 'qualified', name: 'Qualified', count: 12, color: 'amber' },
        { id: 'viewing', name: 'Viewing Scheduled', count: 7, color: 'blue' },
        { id: 'offer', name: 'Offer Made', count: 5, color: 'purple' },
        { id: 'negotiation', name: 'Negotiation', count: 3, color: 'rose' }
    ];

    let html = '';
    stages.forEach(stage => {
        html += `
            <div onclick="filterLeads('${stage.id}')" class="bg-white border border-gray-100 rounded-3xl p-6 cursor-pointer card-hover">
                <div class="text-4xl font-bold text-${stage.color}-600">${stage.count}</div>
                <div class="font-medium mt-1">${stage.name}</div>
                <div class="h-1.5 bg-gray-100 rounded-full mt-6 overflow-hidden">
                    <div class="h-full bg-${stage.color}-500 w-3/4"></div>
                </div>
            </div>
        `;
    });
    document.getElementById('leads-pipeline').innerHTML = html;
}

// ==================== PROPERTY UPLOAD + AI MARKETING ====================
function showPropertyModal() {
    document.getElementById('property-modal').classList.remove('hidden');
    document.getElementById('ai-marketing-output').classList.add('hidden');
}

async function generateAIMarketing() {
    const output = document.getElementById('ai-marketing-output');
    output.classList.remove('hidden');
    output.innerHTML = `
        <div class="space-y-6">
            <div class="bg-white p-5 rounded-2xl">
                <h4 class="font-semibold mb-2">AI Property Description</h4>
                <p class="text-gray-600">Stunning 4BR maisonette in prime Lavington with modern finishes, spacious garden, and proximity to top schools...</p>
            </div>
            <div>
                <h4 class="font-semibold mb-3">Ready-to-post Content</h4>
                <div class="grid grid-cols-1 gap-4">
                    <div class="bg-white p-4 rounded-2xl text-sm">📸 Instagram Caption: "Dream home alert in Lavington! DM for viewing 🔥"</div>
                    <div class="bg-white p-4 rounded-2xl text-sm">💬 WhatsApp Broadcast: "New listing: 4BR Lavington KSh 32M. Ready for immediate viewing?"</div>
                </div>
            </div>
        </div>
    `;
}

function saveProperty() {
    alert("Property uploaded! AI content generated and ready to publish on WhatsApp, Facebook, Instagram.");
    closeModal();
}

// ==================== DEAL ROOM ====================
let currentDeal = null;

function openDealRoom(deal) {
    currentDeal = deal;
    document.getElementById('deal-room-modal').classList.remove('hidden');
    document.getElementById('deal-title').textContent = deal.title || "Deal Room";
    
    // Timeline
    const timelineHTML = `
        <div class="flex gap-4">
            <div class="w-6 h-6 rounded-full bg-emerald-500 flex items-center justify-center text-white text-xs">1</div>
            <div class="flex-1">
                <div class="font-medium">Offer Accepted</div>
                <div class="text-sm text-gray-500">2 days ago</div>
            </div>
        </div>
        <!-- more steps... -->
    `;
    document.getElementById('deal-timeline').innerHTML = timelineHTML;
}

function getAINegotiationAdvice() {
    const input = document.getElementById('negotiation-input').value;
    if (!input) return;
    
    document.getElementById('ai-negotiation-response').classList.remove('hidden');
    document.getElementById('ai-negotiation-response').innerHTML = `
        <strong>AI Suggestion:</strong> Highlight recent comparable sales in the area (KSh 29-31M). Offer flexible payment terms or include furnishings to close the gap.
    `;
}

function advanceDealStage() {
    alert("Stage advanced! AI updated pipeline and sent notifications.");
}

// Modal helpers
function closeModal() {
    document.querySelectorAll('.fixed.inset-0').forEach(m => m.classList.add('hidden'));
}

function showAddLeadModal() {
    alert("New Lead Capture (WhatsApp integration ready)");
}

// Init
window.onload = () => {
    loadLeadsPipeline();
    navigateTo('dashboard');
    
    // Demo: Open a deal room after 2s
    setTimeout(() => {
        openDealRoom({ title: "4BR Lavington Maisonette - KSh 32M" });
    }, 1500);
};
</script>
</body>
</html>
