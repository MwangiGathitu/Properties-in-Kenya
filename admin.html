<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>

  <!-- Supabase CDN (ONLY ONE SOURCE - NO DUPLICATES) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    button {
      margin: 5px;
      padding: 6px 10px;
      cursor: pointer;
    }

    input {
      padding: 8px;
      margin: 5px;
    }

    .hidden {
      display: none;
    }

    .tabs button {
      margin-right: 8px;
    }
  </style>
</head>

<body>

<!-- LOGIN BOX -->
<div id="loginBox" class="box">
  <h2>Admin Login</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- ADMIN PANEL -->
<div id="adminBox" class="hidden">

  <h2>Admin Control Room</h2>

  <button onclick="logout()">Logout</button>

  <hr>

  <!-- TABS -->
  <div class="tabs">
    <button onclick="setTab('pending')">Pending</button>
    <button onclick="setTab('approved')">Approved</button>
    <button onclick="setTab('rejected')">Rejected</button>
    <button onclick="setTab('all')">All</button>
  </div>

  <br>

  <div id="listings"></div>
</div>

<script>
// ==============================
// SUPABASE CONFIG (YOUR KEY)
// ==============================

const supabaseUrl = "https://nqwvsmuvltbiekfnvovx.supabase.co";

const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xd3ZzbXV2bHRiaWVrZm52b3Z4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjU4MDAsImV4cCI6MjA5NjE0MTgwMH0.Xrc-bbAuWdvKSPHnVhTaLiQphV61xeYtDepWePqsrdo";

const supabase = supabase.createClient(supabaseUrl, supabaseKey);

// ==============================
// STATE
// ==============================

let user = null;
let profile = null;
let listings = [];
let tab = "pending";

// ==============================
// LOGIN
// ==============================

async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await supabase.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    alert(error.message);
    return;
  }

  user = data.user;

  const { data: prof } = await supabase
    .from("profiles")
    .select("role")
    .eq("id", user.id)
    .single();

  profile = prof;

  if (!profile || profile.role !== "admin") {
    alert("Access denied");
    return;
  }

  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("adminBox").classList.remove("hidden");

  loadListings();
}

window.login = login;

// ==============================
// LOGOUT
// ==============================

async function logout() {
  await supabase.auth.signOut();
  location.reload();
}

window.logout = logout;

// ==============================
// LOAD LISTINGS
// ==============================

async function loadListings() {
  const { data, error } = await supabase
    .from("properties")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    console.log("Load error:", error);
    return;
  }

  listings = data || [];
  render();
}

// ==============================
// TABS
// ==============================

function setTab(t) {
  tab = t;
  render();
}

window.setTab = setTab;

// ==============================
// APPROVE
// ==============================

async function approve(id) {
  await supabase
    .from("properties")
    .update({
      approval_status: "approved",
      approved_at: new Date().toISOString()
    })
    .eq("id", id);

  loadListings();
}

window.approve = approve;

// ==============================
// REJECT
// ==============================

async function reject(id) {
  await supabase
    .from("properties")
    .update({
      approval_status: "rejected",
      rejected_at: new Date().toISOString()
    })
    .eq("id", id);

  loadListings();
}

window.reject = reject;

// ==============================
// RENDER
// ==============================

function render() {
  const container = document.getElementById("listings");
  container.innerHTML = "";

  const filtered = listings.filter(p => {
    if (tab !== "all" && p.approval_status !== tab) return false;
    return true;
  });

  if (filtered.length === 0) {
    container.innerHTML = "<p>No listings found</p>";
    return;
  }

  filtered.forEach(p => {
    const div = document.createElement("div");
    div.className = "box";

    div.innerHTML = `
      <h3>${p.title}</h3>
      <p>${p.location}</p>
      <p>Status: <b>${p.approval_status}</b></p>

      <button onclick="approve('${p.id}')">Approve</button>
      <button onclick="reject('${p.id}')">Reject</button>
    `;

    container.appendChild(div);
  });
}
</script>

</body>
</html>
