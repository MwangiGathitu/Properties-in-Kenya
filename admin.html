<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    button {
      margin: 5px;
      padding: 6px 10px;
      cursor: pointer;
    }

    input {
      padding: 8px;
      margin: 5px;
    }

    .hidden {
      display: none;
    }

    .tabs button {
      margin-right: 8px;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox" class="box">
  <h2>Admin Login</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- ADMIN -->
<div id="adminBox" class="hidden">

  <h2>Admin Control Room</h2>

  <button onclick="logout()">Logout</button>

  <hr>

  <!-- TABS -->
  <div class="tabs">
    <button onclick="setTab('pending')">Pending</button>
    <button onclick="setTab('approved')">Approved</button>
    <button onclick="setTab('rejected')">Rejected</button>
    <button onclick="setTab('all')">All</button>
  </div>

  <br>

  <!-- FILTERS -->
  <input id="search" placeholder="Search title..." oninput="render()">
  <input id="location" placeholder="Location..." oninput="render()">

  <hr>

  <div id="listings"></div>
</div>

<script>
const supabaseUrl = "https://nqwvsmuvltbiekfnvovx.supabase.co";
const supabaseKey = "PASTE_YOUR_ANON_KEY_HERE";

const supabase = supabase.createClient(supabaseUrl, supabaseKey);

let user = null;
let profile = null;
let listings = [];
let tab = "pending";

// ---------------- LOGIN ----------------
async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await supabase.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    alert(error.message);
    return;
  }

  user = data.user;

  const { data: prof } = await supabase
    .from("profiles")
    .select("role")
    .eq("id", user.id)
    .single();

  profile = prof;

  if (!profile || profile.role !== "admin") {
    alert("Access denied: not admin");
    return;
  }

  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("adminBox").classList.remove("hidden");

  loadListings();
}

// ---------------- LOGOUT ----------------
async function logout() {
  await supabase.auth.signOut();
  location.reload();
}

// ---------------- LOAD ----------------
async function loadListings() {
  const { data, error } = await supabase
    .from("properties")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    console.log("Load error:", error);
    return;
  }

  listings = data;
  render();
}

// ---------------- TAB ----------------
function setTab(t) {
  tab = t;
  render();
}

// ---------------- RENDER ----------------
function render() {
  const container = document.getElementById("listings");
  container.innerHTML = "";

  const search = document.getElementById("search").value?.toLowerCase() || "";
  const location = document.getElementById("location").value?.toLowerCase() || "";

  let filtered = listings.filter(p => {

    if (tab !== "all" && p.approval_status !== tab) return false;

    if (search && !p.title?.toLowerCase().includes(search)) return false;

    if (location && !p.location?.toLowerCase().includes(location)) return false;

    return true;
  });

  if (filtered.length === 0) {
    container.innerHTML = "<p>No listings found</p>";
    return;
  }

  filtered.forEach(p => {
    const div = document.createElement("div");
    div.className = "box";

    div.innerHTML = `
      <h3>${p.title}</h3>
      <p>${p.location}</p>
      <p>Status: <b>${p.approval_status}</b></p>

      <button onclick="approve('${p.id}')">Approve</button>
      <button onclick="reject('${p.id}')">Reject</button>
    `;

    container.appendChild(div);
  });
}

// ---------------- APPROVE ----------------
async function approve(id) {
  await supabase
    .from("properties")
    .update({
      approval_status: "approved",
      approved_at: new Date().toISOString()
    })
    .eq("id", id);

  loadListings();
}

// ---------------- REJECT ----------------
async function reject(id) {
  await supabase
    .from("properties")
    .update({
      approval_status: "rejected",
      rejected_at: new Date().toISOString()
    })
    .eq("id", id);

  loadListings();
}
</script>

</body>
</html>
