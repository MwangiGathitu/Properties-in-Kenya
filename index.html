<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Properties in Kenya — Verified Homes</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* =======================
   BASE
======================= */
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: system-ui, Arial;
  background: #f6f2ea;
  color: #1e293b;
}

/* =======================
   HERO
======================= */
.hero {
  background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
  url('https://images.unsplash.com/photo-1505691723518-36a5ac3b2f7d');
  background-size: cover;
  background-position: center;
  padding: 3rem 1rem;
  color: white;
  text-align: center;
}

.hero h1 { font-size: 2rem; margin-bottom: 0.5rem; }

.search-box {
  margin-top: 1rem;
  display: flex;
  gap: 0.5rem;
  justify-content: center;
  flex-wrap: wrap;
}

.search-box input {
  padding: 12px;
  width: 260px;
  border-radius: 8px;
  border: none;
}

.search-box button {
  padding: 12px 16px;
  background: #16a34a;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

/* =======================
   LISTINGS GRID
======================= */
.container {
  max-width: 1100px;
  margin: auto;
  padding: 1.5rem;
}

.card {
  display: flex;
  background: white;
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 1rem;
  box-shadow: 0 8px 20px rgba(0,0,0,0.05);
  cursor: pointer;
  transition: 0.2s;
}

.card:hover { transform: scale(1.01); }

.card img {
  width: 220px;
  object-fit: cover;
}

.card-body {
  padding: 1rem;
  flex: 1;
}

/* =======================
   TRUST STRIP
======================= */
.badges {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}

.badge {
  font-size: 11px;
  padding: 4px 8px;
  border-radius: 20px;
  background: #eef2ff;
  color: #3730a3;
}

/* =======================
   PRICE + INTELLIGENCE
======================= */
.price {
  font-size: 1.2rem;
  font-weight: bold;
  margin-top: 5px;
}

.meta {
  font-size: 13px;
  color: #475569;
  margin-top: 6px;
}

/* =======================
   ACTIONS
======================= */
.actions {
  margin-top: 10px;
  display: flex;
  gap: 8px;
}

.btn {
  padding: 8px 10px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-size: 13px;
}

.btn-primary { background: #16a34a; color: white; }
.btn-secondary { background: #7c3aed; color: white; }
.btn-outline { background: #e2e8f0; }

/* =======================
   MODAL
======================= */
#modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  justify-content: center;
  align-items: center;
}

.modal-box {
  background: white;
  width: 95%;
  max-width: 1000px;
  border-radius: 12px;
  overflow: hidden;
}

.modal-header {
  padding: 1rem;
  display: flex;
  justify-content: space-between;
  border-bottom: 1px solid #eee;
}

.modal-body {
  display: flex;
  flex-wrap: wrap;
}

.modal-left {
  flex: 2;
  padding: 1rem;
}

.modal-right {
  flex: 1;
  padding: 1rem;
  border-left: 1px solid #eee;
}

.hero-img {
  width: 100%;
  border-radius: 10px;
}

/* =======================
   INTELLIGENCE BOX
======================= */
.intel {
  background: #f1f5f9;
  padding: 10px;
  border-radius: 10px;
  margin-top: 10px;
  font-size: 13px;
}

.close {
  cursor: pointer;
  font-size: 22px;
}
</style>
</head>

<body>

<!-- ================= HERO ================= -->
<div class="hero">
  <h1>Properties in Kenya</h1>
  <p>Verified listings. Real agents. Market intelligence.</p>

  <div class="search-box">
    <input placeholder="Search area e.g. Kilimani" />
    <button>Search</button>
  </div>
</div>

<!-- ================= LISTINGS ================= -->
<div class="container" id="listings"></div>

<!-- ================= MODAL ================= -->
<div id="modal">
  <div class="modal-box">

    <div class="modal-header">
      <h3 id="m-title"></h3>
      <span class="close" onclick="closeModal()">×</span>
    </div>

    <div class="modal-body">

      <div class="modal-left">
        <img id="m-img" class="hero-img" />

        <h3 style="margin-top:10px;" id="m-price"></h3>

        <p id="m-desc" style="margin-top:8px; color:#475569;"></p>

        <div class="intel" id="m-intel"></div>
      </div>

      <div class="modal-right">

        <h4>Agent</h4>
        <p><strong>Verified Agent</strong></p>
        <p style="font-size:13px;">Response rate: 87%</p>

        <button class="btn btn-primary" style="width:100%; margin-top:10px;">
          WhatsApp Agent
        </button>

        <button class="btn btn-secondary" style="width:100%; margin-top:10px;">
          Request Viewing
        </button>

        <button class="btn btn-outline" style="width:100%; margin-top:10px;">
          Unlock Location (KES 100)
        </button>

      </div>

    </div>
  </div>
</div>

<script>
const supabase = supabase.createClient(
  "https://nqwvsmuvltbiekfnvovx.supabase.co",
  "YOUR_KEY"
);

let properties = [];

/* ================= LOAD ================= */
async function load() {
  let { data } = await supabase
    .from("properties")
    .select("*")
    .eq("approval_status", "approved");

  properties = data || [];
  render(properties);
}

/* ================= RENDER CARDS ================= */
function render(list) {
  const container = document.getElementById("listings");
  container.innerHTML = "";

  list.forEach(p => {

    const price = Number(p.price || 0);

    const html = `
      <div class="card" onclick='openModal(${JSON.stringify(p)})'>
        <img src="${p.image_url || 'https://picsum.photos/400'}" />

        <div class="card-body">

          <div class="badges">
            <span class="badge">Verified</span>
            <span class="badge">High Demand</span>
            <span class="badge">2 days old</span>
          </div>

          <h3>${p.title}</h3>

          <div class="price">KES ${price.toLocaleString()}</div>

          <div class="meta">
            Kilimani • Below market by ~8% • 12 views today
          </div>

          <div class="actions">
            <button class="btn btn-primary">View</button>
            <button class="btn btn-outline">Save</button>
          </div>

        </div>
      </div>
    `;

    container.innerHTML += html;
  });
}

/* ================= MODAL ================= */
function openModal(p) {
  document.getElementById("modal").style.display = "flex";

  document.getElementById("m-title").innerText = p.title;
  document.getElementById("m-img").src = p.image_url;
  document.getElementById("m-price").innerText = "KES " + Number(p.price).toLocaleString();
  document.getElementById("m-desc").innerText =
    p.description || "Prime verified property in a high-demand location.";

  document.getElementById("m-intel").innerHTML = `
    <b>Market Insight</b><br><br>
    Avg price in area: KES 12.5M<br>
    This listing: ${p.price}<br>
    <span style="color:green;">~8% below market value</span><br><br>

    Demand score: High<br>
    Interest: 14 inquiries this week
  `;
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

load();
</script>

</body>
</html>
