<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Properties in Kenya — Verified Homes</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f8f4eb; /* Light gold */
      color: #1e293b;
    }

    /* Hero with Kenyan Landmark */
    .hero {
      background: linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.45)), 
                  url('https://picsum.photos/id/1015/2000/800') center/cover no-repeat;
      color: white;
      padding: 3rem 1rem 2rem;
      position: relative;
      text-align: center;
    }
    .hero::after {
      content: '';
      position: absolute;
      bottom: 20px;
      left: 50px;
      width: 220px;
      height: 260px;
      background: rgba(255,255,255,0.95);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/4/4a/Kenya_%28orthographic_projection%29.svg/800px-Kenya_%28orthographic_projection%29.svg.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0.9;
    }

    .logo {
      font-size: 2.2rem;
      font-weight: 700;
      text-decoration: none;
      color: white;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }
    .tagline {
      font-size: 1.15rem;
      margin-top: 0.5rem;
      opacity: 0.95;
    }

    .nav {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin: 2rem 0 1.5rem;
      flex-wrap: wrap;
    }
    .nav a {
      color: white;
      text-decoration: none;
      font-weight: 500;
      padding: 0.5rem 0;
    }

    /* Purple Header Accent */
    header {
      background: #6b21a8;
      padding: 0.8rem 1rem;
      text-align: center;
      color: white;
    }

    .search-container {
      max-width: 1100px;
      margin: 1.5rem auto;
      background: white;
      border-radius: 50px;
      padding: 0.8rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
      box-shadow: 0 6px 25px rgba(0,0,0,0.2);
    }
    .search-container input, .search-container select {
      flex: 1;
      min-width: 160px;
      padding: 0.9rem 1.1rem;
      border: none;
      font-size: 1rem;
      outline: none;
      border-radius: 50px;
    }
    .search-container button {
      background: #22c55e;
      color: white;
      border: none;
      padding: 0.9rem 2.2rem;
      border-radius: 50px;
      font-weight: 600;
      cursor: pointer;
    }

    .claim {
      margin: 1rem auto;
      font-size: 1.05rem;
      background: rgba(255,255,255,0.15);
      display: inline-block;
      padding: 0.5rem 1.5rem;
      border-radius: 30px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: white;
      border-bottom: 1px solid #e2e8f0;
      max-width: 1200px;
      margin: 0 auto;
    }
    .tab {
      padding: 1rem 1.6rem;
      cursor: pointer;
      font-weight: 500;
    }
    .tab.active {
      border-bottom: 4px solid #6b21a8;
      color: #6b21a8;
    }

    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    /* Light Blue Cards */
    #listings {
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
    }
    .card {
      background: #e0f2fe; /* Light blue */
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      display: flex;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .card:hover {
      transform: translateY(-8px);
    }
    .card img {
      width: 380px;
      height: 260px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .card-content {
      padding: 1.6rem;
      flex: 1;
    }
    .card-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
    }
    .card-price {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1e40af;
      margin-bottom: 0.8rem;
    }
  </style>
</head>
<body>

  <!-- Purple Top Bar -->
  <header>
    <div style="max-width:1200px; margin:auto; font-weight:500;">
      Properties in Kenya — Verified • Trusted • Transparent
    </div>
  </header>

  <!-- Hero Section with Landmark + Map -->
  <div class="hero">
    <a href="/" class="logo">🏡 Properties in Kenya</a>
    <p class="tagline">The No.1 platform for verified property in Eastlands</p>

    <div class="nav">
      <a href="#">Buy</a>
      <a href="#">Rent</a>
      <a href="#">Lease</a>
      <a href="#">Projects</a>
      <a href="/agent.html">Agents</a>
    </div>

    <div class="search-container">
      <input type="text" id="mainSearch" placeholder="Search location or title (Ruai, Kayole, Embakasi...)">
      <input type="text" id="locationFilter" placeholder="Estate / Area">
      <select id="typeFilter">
        <option value="all">All Types</option>
        <option value="for sale">For Sale</option>
        <option value="for rent">For Rent</option>
        <option value="for lease">For Lease</option>
        <option value="project">Projects</option>
      </select>
      <input type="number" id="minPrice" placeholder="Min Price (KES)">
      <button onclick="applyFilters()">🔍 Find Property</button>
    </div>

    <div class="claim">🏆 Properties in Kenya is the No.1 verified property platform in Eastlands</div>
  </div>

  <!-- Tabs -->
  <div class="tabs" id="tabs">
    <div class="tab active" data-type="all">All</div>
    <div class="tab" data-type="for sale">For Sale</div>
    <div class="tab" data-type="for rent">For Rent</div>
    <div class="tab" data-type="for lease">For Lease</div>
    <div class="tab" data-type="project">Projects</div>
  </div>

  <div class="container">
    <div id="listings"></div>
  </div>

  <!-- Detail Modal (same as before) -->
  <div id="detailModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:2000; align-items:center; justify-content:center;">
    <div style="background:white; max-width:1100px; width:95%; max-height:95vh; overflow:auto; border-radius:16px;">
      <div style="padding:1rem 1.5rem; border-bottom:1px solid #eee; display:flex; justify-content:space-between;">
        <h2 id="modalTitle"></h2>
        <span onclick="closeModal()" style="font-size:2rem; cursor:pointer; color:#6b21a8;">×</span>
      </div>
      <div style="display:flex; gap:2rem; padding:1.5rem; flex-wrap:wrap;">
        <div style="flex:2;">
          <img id="mainImage" style="width:100%; border-radius:12px; max-height:480px; object-fit:cover;">
        </div>
        <div style="flex:1;">
          <div id="modalPrice" style="font-size:2.2rem; font-weight:700; color:#1e40af;"></div>
          <div id="modalMeta" style="margin:1rem 0;"></div>
          <p id="modalDescription"></p>
          <a id="modalWA" href="#" target="_blank" style="background:#25D366; color:white; padding:1rem 1.8rem; border-radius:8px; text-decoration:none; display:inline-flex; align-items:center; gap:8px; margin-top:1.5rem; font-weight:600;">💬 WhatsApp Agent</a>
        </div>
      </div>
    </div>
  </div>

<script>
  const supabaseUrl = "https://nqwvsmuvltbiekfnvovx.supabase.co";
  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xd3ZzbXV2bHRiaWVrZm52b3Z4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjU4MDAsImV4cCI6MjA5NjE0MTgwMH0.Xrc-bbAuWdvKSPHnVhTaLiQphV61xeYtDepWePqsrdo";
  const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

  let allProperties = [];
  let savedProperties = JSON.parse(localStorage.getItem("savedProperties") || "[]");

  async function loadProperties() {
    const { data } = await supabaseClient
      .from("properties")
      .select("*")
      .eq("approval_status", "approved")
      .order("created_at", { ascending: false });
    allProperties = data || [];
    renderListings(allProperties);
  }

  function renderListings(properties) {
    const container = document.getElementById("listings");
    container.innerHTML = "";

    properties.forEach(p => {
      const card = document.createElement("div");
      card.className = "card";
      card.onclick = () => openDetail(p);

      const img = p.image_url || `https://picsum.photos/seed/${p.id}/600/400`;
      const price = p.price ? `KSh ${Number(p.price).toLocaleString()}` : "Price on request";

      card.innerHTML = `
        <img src="${img}" alt="${p.title}">
        <div class="card-content">
          <div class="card-title">${p.title || "Untitled Property"}</div>
          <div class="card-price">${price}</div>
          <div style="color:#334155; font-size:1.05rem;">📍 ${p.location || "N/A"}</div>
          <div style="margin-top:8px; color:#6b7280;">${p.property_type ? p.property_type.toUpperCase() : ""}</div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  window.openDetail = function(p) {
    document.getElementById("modalTitle").textContent = p.title;
    document.getElementById("modalPrice").textContent = p.price ? `KSh ${Number(p.price).toLocaleString()}` : "Price on request";
    document.getElementById("modalMeta").innerHTML = `📍 <strong>${p.location}</strong><br>Type: ${p.property_type || "—"}`;
    document.getElementById("modalDescription").textContent = p.description || "No description available.";
    document.getElementById("mainImage").src = p.image_url || `https://picsum.photos/seed/${p.id}/800/500`;
    document.getElementById("detailModal").style.display = "flex";
  };

  window.closeModal = () => document.getElementById("detailModal").style.display = "none";

  function applyFilters() {
    const term = document.getElementById("mainSearch").value.toLowerCase().trim();
    const location = document.getElementById("locationFilter").value.toLowerCase().trim();
    const type = document.getElementById("typeFilter").value;
    const minPrice = parseFloat(document.getElementById("minPrice").value) || 0;

    const filtered = allProperties.filter(p => {
      const matchesSearch = !term || (p.title + " " + p.location).toLowerCase().includes(term);
      const matchesLocation = !location || (p.location || "").toLowerCase().includes(location);
      const matchesType = type === "all" || (p.property_type || "").toLowerCase().includes(type);
      const matchesPrice = (p.price || 0) >= minPrice;
      return matchesSearch && matchesLocation && matchesType && matchesPrice;
    });
    renderListings(filtered);
  }

  // Tab functionality
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const type = tab.dataset.type;
      const filtered = type === 'all' ? allProperties : allProperties.filter(p => 
        (p.property_type || "").toLowerCase().includes(type)
      );
      renderListings(filtered);
    });
  });

  loadProperties();
</script>
</body>
</html>
