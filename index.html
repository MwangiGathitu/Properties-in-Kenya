<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Properties in Kenya — Verified Homes</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ... (Keep all previous styles for hero, cards, etc.) ... */
    .gallery {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .thumb {
      width: 90px;
      height: 70px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .thumb.active {
      border-color: #6b21a8;
    }
  </style>
</head>
<body>
  <!-- Header with Shortlist Link -->
  <header style="background:#6b21a8; padding:0.8rem; text-align:center; color:white;">
    <div style="max-width:1200px; margin:auto; display:flex; justify-content:space-between; align-items:center;">
      <span>Properties in Kenya — Verified • Trusted</span>
      <a href="#" onclick="showShortlist()" style="color:white; text-decoration:underline;">❤️ My Shortlist</a>
    </div>
  </header>

  <!-- Hero, Search, Quick Actions, Tabs, Listings (same as before) -->

  <!-- Rich Detail Modal with Gallery -->
  <div id="detailModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:3000; align-items:center; justify-content:center;">
    <div style="background:white; max-width:1200px; width:95%; max-height:95vh; overflow:auto; border-radius:12px;">
      <div class="modal-header" style="padding:1rem 1.5rem; border-bottom:1px solid #eee; display:flex; justify-content:space-between;">
        <h2 id="modalTitle"></h2>
        <span onclick="closeModal()" style="font-size:2rem; cursor:pointer;">×</span>
      </div>
      
      <div style="padding:2rem; display:flex; gap:2rem; flex-wrap:wrap;">
        <div style="flex:2; min-width:300px;">
          <img id="mainImage" style="width:100%; height:420px; object-fit:cover; border-radius:12px;" alt="">
          <div id="gallery" class="gallery"></div>
        </div>
        
        <div style="flex:1; min-width:280px;">
          <div id="modalPrice" style="font-size:2.2rem; font-weight:700; color:#1e40af;"></div>
          <div id="modalMeta"></div>
          <p id="modalDescription" style="line-height:1.7; margin:1.5rem 0;"></p>
          
          <button onclick="requestLocation(currentPropertyId)" style="width:100%; background:#6b21a8; color:white; padding:14px; border:none; border-radius:8px; font-size:1.1rem; margin-bottom:12px;">
            Request Exact Location
          </button>
          <button onclick="alert('Viewing scheduled!')" style="width:100%; background:#22c55e; color:white; padding:12px; border:none; border-radius:8px;">
            📅 Book Viewing
          </button>
        </div>
      </div>
    </div>
  </div>

<script>
  let currentPropertyId = null;
  let savedProperties = JSON.parse(localStorage.getItem("savedProperties") || "[]");

  // ... loadProperties and renderListings (with enhanced cards) remain the same ...

  window.openDetail = function(p) {
    currentPropertyId = p.id;
    document.getElementById("modalTitle").textContent = p.title;
    document.getElementById("modalPrice").textContent = p.price ? `KSh ${Number(p.price).toLocaleString()}` : "Price on request";
    document.getElementById("modalDescription").textContent = p.description || "Spacious family home in a secure neighbourhood.";

    const mainImg = document.getElementById("mainImage");
    mainImg.src = p.image_url || `https://picsum.photos/seed/${p.id}/1200/600`;

    // Multiple images gallery (demo images)
    const gallery = document.getElementById("gallery");
    gallery.innerHTML = `
      <img src="${mainImg.src}" class="thumb active" onclick="changeImage(this)">
      <img src="https://picsum.photos/seed/${p.id}1/600/400" class="thumb" onclick="changeImage(this)">
      <img src="https://picsum.photos/seed/${p.id}2/600/400" class="thumb" onclick="changeImage(this)">
      <img src="https://picsum.photos/seed/${p.id}3/600/400" class="thumb" onclick="changeImage(this)">
    `;

    document.getElementById("detailModal").style.display = "flex";
  };

  window.changeImage = function(img) {
    document.getElementById("mainImage").src = img.src;
    document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
    img.classList.add('active');
  };

  window.showShortlist = function() {
    if (savedProperties.length === 0) {
      alert("Your shortlist is empty. Heart any property to save it here.");
      return;
    }
    // For now, show simple list. We can make a full page later.
    let msg = "❤️ Your Shortlist:\n\n";
    savedProperties.forEach(id => {
      msg += `• Property #${id}\n`;
    });
    alert(msg + "\n\nFull Shortlist page coming soon.");
  };

  // Close modal
  window.closeModal = () => document.getElementById("detailModal").style.display = "none";
</script>
</body>
</html>
