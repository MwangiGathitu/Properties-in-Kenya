<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PropDesk Admin — Properties in Kenya</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      background: #f4f4f4;
      color: #111;
    }
    header {
      padding: 16px 20px;
      background: white;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    h1 { font-size: 20px; margin: 0; }
    .actions button {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      margin-left: 6px;
    }
    .btn-primary { background: #0070f3; color: white; }
    .btn-success { background: #10b981; color: white; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-logout { background: #6b7280; color: white; }
    .login-box, .dashboard {
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
    }
    .login-box input {
      padding: 12px;
      margin: 8px 0;
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 16px;
    }
    .card {
      background: white;
      padding: 16px;
      margin-bottom: 12px;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .property-info { flex: 1; min-width: 280px; }
    .property-info strong { font-size: 16px; display: block; }
    .property-info span { font-size: 14px; color: #666; }
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
    }
    .status-approved { background: #d1fae5; color: #065f46; }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-rejected { background: #fee2e2; color: #991b1b; }
    .error { color: #ef4444; margin-top: 10px; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
<header>
  <h1>🏠 Properties in Kenya — Admin</h1>
  <span id="adminEmail" style="font-size:14px; color:#555;"></span>
  <button id="logoutBtn" class="btn-logout" style="display:none;" onclick="logout()">Logout</button>
</header>

<!-- LOGIN -->
<div id="loginBox" class="login-box">
  <h2>Admin Login</h2>
  <input type="email" id="email" placeholder="Email" autocomplete="email">
  <input type="password" id="password" placeholder="Password" autocomplete="current-password">
  <br><br>
  <button class="btn-primary" onclick="login()">Log in</button>
  <p id="loginError" class="error"></p>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="dashboard" style="display:none;">
  <div id="statusMsg">Loading properties...</div>
  <div id="list"></div>
</div>

<script>
  const supabaseUrl = "https://nqwvsmuvltbiekfnvovx.supabase.co";
  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xd3ZzbXV2bHRiaWVrZm52b3Z4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjU4MDAsImV4cCI6MjA5NjE0MTgwMH0.Xrc-bbAuWdvKSPHnVhTaLiQphV61xeYtDepWePqsrdo";
  
  const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

  const loginBox = document.getElementById("loginBox");
  const dashboard = document.getElementById("dashboard");
  const loginError = document.getElementById("loginError");
  const adminEmailSpan = document.getElementById("adminEmail");
  const logoutBtn = document.getElementById("logoutBtn");
  const statusMsg = document.getElementById("statusMsg");
  const listContainer = document.getElementById("list");

  async function login() {
    loginError.textContent = "";
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
      loginError.textContent = error.message;
      return;
    }
    checkAndShowAdmin();
  }

  async function logout() {
    await supabaseClient.auth.signOut();
    resetUI();
  }

  function resetUI() {
    loginBox.style.display = "block";
    dashboard.style.display = "none";
    logoutBtn.style.display = "none";
    adminEmailSpan.textContent = "";
  }

  async function checkAndShowAdmin() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) return resetUI();

    const { data: profile } = await supabaseClient
      .from("profiles")
      .select("role")
      .eq("id", user.id)
      .single();

    if (!profile || profile.role !== "admin") {
      await supabaseClient.auth.signOut();
      loginError.textContent = "Access denied. Not an admin account.";
      resetUI();
      return;
    }

    loginBox.style.display = "none";
    dashboard.style.display = "block";
    logoutBtn.style.display = "inline-block";
    adminEmailSpan.textContent = user.email || "";
    
    loadAllProperties();
  }

  async function loadAllProperties() {
    statusMsg.textContent = "Loading properties...";
    listContainer.innerHTML = "";

    const { data, error } = await supabaseClient
      .from("properties")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      statusMsg.textContent = "Error loading properties: " + error.message;
      return;
    }

    statusMsg.textContent = `${data.length} properties loaded`;

    data.forEach(prop => {
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <div class="property-info">
          <strong>${prop.title || "Untitled Property"}</strong>
          <span>${prop.location || "No location"} • KSh ${prop.price ? Number(prop.price).toLocaleString() : "—"}</span>
          <span class="status-badge status-${prop.approval_status || 'pending'}">${(prop.approval_status || 'pending').toUpperCase()}</span>
          ${prop.description ? `<p style="margin:8px 0 0 0; font-size:14px; color:#555;">${prop.description.substring(0,120)}...</p>` : ''}
        </div>
        <div class="actions">
          <button class="btn-success" onclick="updateStatus('${prop.id}', 'approved')">Approve</button>
          <button class="btn-danger" onclick="confirmReject('${prop.id}')">Reject</button>
        </div>
      `;
      listContainer.appendChild(div);
    });
  }

  window.updateStatus = async function(propertyId, newStatus) {
    const btns = document.querySelectorAll(`button[onclick*="('${propertyId}'"]`);
    btns.forEach(b => b.disabled = true);

    const { error } = await supabaseClient
      .from("properties")
      .update({ approval_status: newStatus })
      .eq("id", propertyId);

    if (error) {
      alert("Update failed: " + error.message);
    } else {
      loadAllProperties(); // Refresh
    }
  };

  window.confirmReject = function(propertyId) {
    if (confirm("Reject this property? This cannot be undone easily.")) {
      updateStatus(propertyId, 'rejected');
    }
  };

  // Auto-check session on load
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session?.user) {
      await checkAndShowAdmin();
    } else {
      loginBox.style.display = "block";
    }
  })();
</script>
</body>
</html>
