<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Center - Properties in Kenya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
        body { font-family: 'Inter', system_ui, sans-serif; }
        .heading-font { font-family: 'Space Grotesk', sans-serif; }
        .sidebar-link.active { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; }
        .sidebar-link:hover:not(.active) { background-color: #fef3c7; color: #d97706; }
        @media (max-width: 1024px) { .sidebar { display: none; } .sidebar.mobile-open { display: block; } }
        .modal { animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes modalPop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        /* Kanban specific styles */
        .kanban-column { min-height: 200px; }
        .kanban-card { cursor: grab; transition: all 0.2s; }
        .kanban-card:active { cursor: grabbing; }
        .kanban-card.dragging { opacity: 0.5; transform: scale(0.95); }
        
        /* Hide scrollbar for clean horizontal scroll on mobile */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100">

<button onclick="toggleMobileMenu()" class="lg:hidden fixed top-4 left-4 z-50 bg-white p-3 rounded-xl shadow-lg">
    <i class="fas fa-bars text-gray-700"></i>
</button>
<div id="mobile-overlay" onclick="toggleMobileMenu()" class="hidden lg:hidden fixed inset-0 bg-black/50 z-40"></div>

<div class="flex min-h-screen">
    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar fixed lg:sticky top-0 left-0 h-screen w-72 bg-white border-r border-gray-200 z-40 overflow-y-auto">
        <div class="p-6 border-b border-gray-200">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-amber-400 to-yellow-600 rounded-xl flex items-center justify-center text-white font-bold text-xl">🏠</div>
                <div><h1 class="heading-font text-xl font-bold">RealtorOS</h1><p class="text-xs text-gray-500">Agent Dashboard</p></div>
            </div>
        </div>
        <nav class="p-4 space-y-1">
            <a href="agent-dashboard.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-700"><i class="fas fa-chart-line w-5"></i> Dashboard</a>
            <a href="agent-properties.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-700"><i class="fas fa-building w-5"></i> Properties</a>
            <a href="shared-listings.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-700"><i class="fas fa-share-nodes w-5"></i> Shared Listings</a>
            <a href="buyer-requests.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-700"><i class="fas fa-user-tie w-5"></i> Buyer Requests</a>
            <a href="lead-center.html" class="sidebar-link active flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium"><i class="fas fa-bullseye w-5"></i> Lead Center</a>
            <a href="agent-network.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-700"><i class="fas fa-users w-5"></i> Agent Network</a>
            <a href="messages.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-700"><i class="fas fa-comment-dots w-5"></i> Messages</a>
            <a href="commissions.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-700"><i class="fas fa-wallet w-5"></i> Commissions</a>
            <div class="pt-4 mt-4 border-t border-gray-200">
                <a href="#" onclick="logout()" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-700"><i class="fas fa-sign-out-alt w-5"></i> Logout</a>
            </div>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 lg:ml-0 w-full flex flex-col h-screen overflow-hidden">
        <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between flex-shrink-0">
            <div class="lg:pl-0 pl-12">
                <h1 class="heading-font text-2xl font-bold">Lead Center</h1>
                <p class="text-sm text-gray-500">Drag and drop leads or use the move button</p>
            </div>
            <button onclick="openAddLeadModal()" class="flex items-center gap-2 bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-4 py-2.5 rounded-xl font-semibold text-sm hover:shadow-lg transition">
                <i class="fas fa-plus"></i> <span class="hidden sm:inline">Add Lead</span>
            </button>
        </header>

        <!-- Kanban Board -->
        <div class="flex-1 overflow-x-auto overflow-y-hidden p-6 hide-scrollbar">
            <div class="flex gap-6 h-full min-w-max" id="kanban-board">
                <!-- Columns will be injected here by JS -->
            </div>
        </div>
    </main>
</div>

<!-- ADD LEAD MODAL -->
<div id="add-lead-modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-50 p-4">
    <div class="modal bg-white rounded-3xl w-full max-w-lg overflow-hidden">
        <div class="p-6 border-b flex items-center justify-between">
            <h2 class="heading-font text-xl font-bold">Add New Lead</h2>
            <button onclick="closeAddLeadModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100"><i class="fas fa-times text-xl"></i></button>
        </div>
        <form id="add-lead-form" class="p-6 space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Buyer Name *</label>
                    <input type="text" id="lead-name" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Phone Number *</label>
                    <input type="tel" id="lead-phone" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="0712345678">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Budget (KES)</label>
                    <input type="number" id="lead-budget" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="10000000">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Source</label>
                    <select id="lead-source" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                        <option>WhatsApp</option><option>Website</option><option>Referral</option><option>Facebook</option><option>Walk-in</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Property Interest</label>
                <input type="text" id="lead-interest" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="e.g., 3BR in Kilimani">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Initial Notes</label>
                <textarea id="lead-notes" rows="3" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="e.g., Pre-approved for mortgage, wants to view this weekend."></textarea>
            </div>
            <div class="flex gap-4 pt-2">
                <button type="button" onclick="closeAddLeadModal()" class="flex-1 py-3 border border-gray-300 rounded-xl font-semibold hover:bg-gray-50">Cancel</button>
                <button type="submit" class="flex-1 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl font-semibold hover:shadow-lg">Save Lead</button>
            </div>
        </form>
    </div>
</div>

<!-- LEAD DETAILS & ACTIVITY MODAL -->
<div id="lead-details-modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-50 p-4">
    <div class="modal bg-white rounded-3xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
        <div class="p-6 border-b bg-gray-50 flex items-center justify-between sticky top-0">
            <div>
                <h2 class="heading-font text-xl font-bold" id="detail-name">Lead Name</h2>
                <p class="text-sm text-gray-500" id="detail-phone">0712345678</p>
            </div>
            <button onclick="closeDetailsModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-200"><i class="fas fa-times text-xl"></i></button>
        </div>
        <div class="p-6 space-y-6">
            <div class="grid grid-cols-2 gap-4 text-sm">
                <div class="bg-blue-50 p-3 rounded-xl">
                    <p class="text-blue-600 font-semibold mb-1">Budget</p>
                    <p class="font-bold text-gray-900" id="detail-budget">KES 0</p>
                </div>
                <div class="bg-purple-50 p-3 rounded-xl">
                    <p class="text-purple-600 font-semibold mb-1">Interest</p>
                    <p class="font-bold text-gray-900 truncate" id="detail-interest">Any</p>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="flex gap-2">
                <a id="detail-wa-link" href="#" target="_blank" class="flex-1 bg-green-500 text-white py-2.5 rounded-xl text-center font-semibold text-sm hover:bg-green-600 transition">
                    <i class="fab fa-whatsapp mr-1"></i> WhatsApp
                </a>
                <a id="detail-call-link" href="#" class="flex-1 bg-blue-600 text-white py-2.5 rounded-xl text-center font-semibold text-sm hover:bg-blue-700 transition">
                    <i class="fas fa-phone mr-1"></i> Call
                </a>
            </div>

            <!-- Add Activity -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Add Activity / Note</label>
                <div class="flex gap-2">
                    <input type="text" id="new-activity-text" class="flex-1 px-4 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm" placeholder="e.g., Called, left voicemail">
                    <button onclick="addActivity()" class="bg-gray-900 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-gray-800">Add</button>
                </div>
            </div>

            <!-- Activity Timeline -->
            <div>
                <h3 class="text-sm font-semibold text-gray-700 mb-3">History</h3>
                <div id="activity-timeline" class="space-y-3 max-h-48 overflow-y-auto pr-2">
                    <!-- Populated by JS -->
                </div>
            </div>
            
            <!-- Move Lead -->
            <div class="pt-4 border-t">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Move to Stage:</label>
                <select id="detail-status-select" onchange="updateLeadStatusFromModal(this.value)" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white font-medium">
                    <option value="new">New Lead</option>
                    <option value="contacted">Contacted</option>
                    <option value="viewing">Viewing Scheduled</option>
                    <option value="negotiating">Negotiating</option>
                    <option value="offer">Offer Made</option>
                    <option value="closed_won">Closed Won 🎉</option>
                    <option value="closed_lost">Closed Lost</option>
                </select>
            </div>
        </div>
    </div>
</div>

<script>
const supabase = window.supabase.createClient(
    'https://nqvsmuvltbiekfnvovx.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xd3ZzbXV2bHRiaWVrZm52b3Z4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjU4MDAsImV4cCI6MjA5NjE0MTgwMH0.Xrc-bbAuWdvKSPHnVhTaLiQphV61xeYtDepWePqsrdo'
);

let currentUser = null;
let allLeads = [];
let currentDetailLeadId = null;

const columns = [
    { id: 'new', title: 'New Leads', color: 'blue', icon: 'fa-inbox' },
    { id: 'contacted', title: 'Contacted', color: 'amber', icon: 'fa-phone' },
    { id: 'viewing', title: 'Viewing', color: 'purple', icon: 'fa-calendar-check' },
    { id: 'negotiating', title: 'Negotiating', color: 'orange', icon: 'fa-handshake' },
    { id: 'offer', title: 'Offer Made', color: 'indigo', icon: 'fa-file-contract' },
    { id: 'closed_won', title: 'Closed Won', color: 'green', icon: 'fa-trophy' },
    { id: 'closed_lost', title: 'Closed Lost', color: 'gray', icon: 'fa-times-circle' }
];

async function checkAuth() {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) { window.location.href = 'login.html'; return; }
    currentUser = user;
    loadLeads();
}

function formatKES(amount) {
    return new Intl.NumberFormat('en-KE', { style: 'currency', currency: 'KES', maximumFractionDigits: 0 }).format(amount || 0);
}

function getTimeAgo(dateString) {
    const date = new Date(dateString);
    const now = new Date();
    const seconds = Math.floor((now - date) / 1000);
    if (seconds < 60) return 'Just now';
    if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
    if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
    return `${Math.floor(seconds / 86400)}d ago`;
}

async function loadLeads() {
    try {
        const { data, error } = await supabase
            .from('leads')
            .select('*')
            .eq('agent_id', currentUser.id)
            .order('updated_at', { ascending: false });
        
        if (error) throw error;
        allLeads = data || [];
        renderKanban();
    } catch (err) {
        console.error('Error loading leads:', err);
    }
}

function renderKanban() {
    const board = document.getElementById('kanban-board');
    board.innerHTML = columns.map(col => {
        const colLeads = allLeads.filter(l => l.status === col.id);
        return `
        <div class="flex flex-col w-80 flex-shrink-0">
            <div class="flex items-center justify-between mb-3 px-1">
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 rounded-full bg-${col.color}-500"></div>
                    <h3 class="font-bold text-gray-700 text-sm uppercase tracking-wide">${col.title}</h3>
                    <span class="bg-gray-200 text-gray-600 text-xs font-bold px-2 py-0.5 rounded-full">${colLeads.length}</span>
                </div>
            </div>
            
            <div class="kanban-column bg-gray-200/50 rounded-2xl p-3 flex-1 overflow-y-auto space-y-3 border-2 border-transparent transition-colors" 
                 id="col-${col.id}"
                 ondragover="handleDragOver(event)" 
                 ondrop="handleDrop(event, '${col.id}')">
                
                ${colLeads.length === 0 ? '<p class="text-center text-gray-400 text-xs py-8">Drop leads here</p>' : ''}
                
                ${colLeads.map(lead => `
                    <div class="kanban-card bg-white p-4 rounded-xl shadow-sm border border-gray-100 relative group" 
                         draggable="true" 
                         ondragstart="handleDragStart(event, '${lead.id}')"
                         onclick="openLeadDetails('${lead.id}')">
                        
                        <!-- Mobile Move Dropdown (Always visible but subtle) -->
                        <select onchange="event.stopPropagation(); moveLead('${lead.id}', this.value); this.value='';" 
                                class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 md:opacity-0 opacity-100 w-24 text-xs bg-gray-50 border border-gray-200 rounded-lg py-1 px-1 z-10"
                                onclick="event.stopPropagation()">
                            <option value="" disabled selected>Move to...</option>
                            ${columns.filter(c => c.id !== col.id).map(c => `<option value="${c.id}">${c.title}</option>`).join('')}
                        </select>

                        <div class="flex items-start justify-between mb-2">
                            <h4 class="font-bold text-gray-900 text-sm leading-tight pr-20">${lead.buyer_name}</h4>
                        </div>
                        
                        ${lead.property_interest ? `<p class="text-xs text-gray-500 mb-2 line-clamp-2"><i class="fas fa-home mr-1 text-gray-400"></i> ${lead.property_interest}</p>` : ''}
                        
                        <div class="flex items-center justify-between mt-3 pt-3 border-t border-gray-50">
                            <span class="text-xs font-semibold text-gray-600">${lead.budget ? formatKES(lead.budget) : 'No budget'}</span>
                            <span class="text-[10px] text-gray-400">${getTimeAgo(lead.updated_at)}</span>
                        </div>
                    </div>
                `).join('')}
            </div>
        </div>`;
    }).join('');
}

// --- Drag and Drop Logic ---
let draggedLeadId = null;

function handleDragStart(event, leadId) {
    draggedLeadId = leadId;
    event.target.classList.add('dragging');
    event.dataTransfer.effectAllowed = 'move';
}

function handleDragOver(event) {
    event.preventDefault(); // Necessary to allow dropping
    event.dataTransfer.dropEffect = 'move';
    const column = event.currentTarget;
    column.classList.add('border-blue-300', 'bg-blue-50');
}

// Clean up drag styles when leaving
document.addEventListener('dragleave', (e) => {
    if (e.target.classList.contains('kanban-column')) {
        e.target.classList.remove('border-blue-300', 'bg-blue-50');
    }
});

async function handleDrop(event, newStatus) {
    event.preventDefault();
    const column = event.currentTarget;
    column.classList.remove('border-blue-300', 'bg-blue-50');
    
    if (draggedLeadId) {
        await moveLead(draggedLeadId, newStatus);
        draggedLeadId = null;
        // Remove dragging class from all elements just in case
        document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
    }
}

// --- Core Move Logic (Used by both Drag & Drop and Mobile Dropdown) ---
async function moveLead(leadId, newStatus) {
    if (!newStatus) return;
    
    // Optimistic UI update
    const lead = allLeads.find(l => l.id === leadId);
    if (lead) lead.status = newStatus;
    renderKanban();

    // Update Supabase
    const { error } = await supabase
        .from('leads')
        .update({ status: newStatus, updated_at: new Date().toISOString() })
        .eq('id', leadId);

    if (error) {
        console.error('Error moving lead:', error);
        alert('Failed to update lead status. Please try again.');
        loadLeads(); // Revert on error
    } else {
        // Log activity
        await supabase.from('lead_activities').insert({
            lead_id: leadId,
            activity_type: 'status_change',
            description: `Moved to ${newStatus.replace('_', ' ').toUpperCase()}`
        });
    }
}

// --- Lead Details Modal ---
async function openLeadDetails(leadId) {
    const lead = allLeads.find(l => l.id === leadId);
    if (!lead) return;
    
    currentDetailLeadId = leadId;
    document.getElementById('detail-name').textContent = lead.buyer_name;
    document.getElementById('detail-phone').textContent = lead.buyer_phone;
    document.getElementById('detail-budget').textContent = lead.budget ? formatKES(lead.budget) : 'Not specified';
    document.getElementById('detail-interest').textContent = lead.property_interest || 'Any';
    document.getElementById('detail-status-select').value = lead.status;
    
    // Clean phone for links
    const cleanPhone = lead.buyer_phone.replace(/\D/g, '');
    const waNumber = cleanPhone.startsWith('0') ? `254${cleanPhone.slice(1)}` : cleanPhone;
    document.getElementById('detail-wa-link').href = `https://wa.me/${waNumber}?text=${encodeURIComponent(`Hi ${lead.buyer_name}, this is your agent from Properties in Kenya.`)}`;
    document.getElementById('detail-call-link').href = `tel:${lead.buyer_phone}`;

    // Load activities
    const { data: activities } = await supabase
        .from('lead_activities')
        .select('*')
        .eq('lead_id', leadId)
        .order('created_at', { ascending: false });

    const timeline = document.getElementById('activity-timeline');
    if (!activities || activities.length === 0) {
        timeline.innerHTML = '<p class="text-xs text-gray-400 text-center py-4">No activity logged yet.</p>';
    } else {
        timeline.innerHTML = activities.map(act => `
            <div class="flex gap-3 text-sm">
                <div class="w-2 h-2 rounded-full bg-blue-500 mt-1.5 flex-shrink-0"></div>
                <div>
                    <p class="text-gray-800 font-medium">${act.description || act.activity_type}</p>
                    <p class="text-xs text-gray-400">${getTimeAgo(act.created_at)}</p>
                </div>
            </div>
        `).join('');
    }

    document.getElementById('lead-details-modal').classList.remove('hidden');
}

async function addActivity() {
    const text = document.getElementById('new-activity-text').value.trim();
    if (!text || !currentDetailLeadId) return;

    const { error } = await supabase.from('lead_activities').insert({
        lead_id: currentDetailLeadId,
        activity_type: 'note',
        description: text
    });

    if (!error) {
        document.getElementById('new-activity-text').value = '';
        openLeadDetails(currentDetailLeadId); // Refresh modal
    }
}

async function updateLeadStatusFromModal(newStatus) {
    await moveLead(currentDetailLeadId, newStatus);
    closeDetailsModal();
}

function closeDetailsModal() {
    document.getElementById('lead-details-modal').classList.add('hidden');
    currentDetailLeadId = null;
}

// --- Add Lead Modal ---
function openAddLeadModal() {
    document.getElementById('add-lead-modal').classList.remove('hidden');
}
function closeAddLeadModal() {
    document.getElementById('add-lead-modal').classList.add('hidden');
    document.getElementById('add-lead-form').reset();
}

document.getElementById('add-lead-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Saving...';

    const newLead = {
        agent_id: currentUser.id,
        buyer_name: document.getElementById('lead-name').value,
        buyer_phone: document.getElementById('lead-phone').value,
        budget: parseFloat(document.getElementById('lead-budget').value) || null,
        source: document.getElementById('lead-source').value,
        property_interest: document.getElementById('lead-interest').value,
        notes: document.getElementById('lead-notes').value,
        status: 'new'
    };

    const { data, error } = await supabase.from('leads').insert([newLead]).select();
    
    btn.disabled = false;
    btn.innerHTML = 'Save Lead';

    if (!error && data) {
        // Log initial activity
        await supabase.from('lead_activities').insert({
            lead_id: data[0].id,
            activity_type: 'created',
            description: `Lead created from ${newLead.source}`
        });
        closeAddLeadModal();
        loadLeads();
    } else {
        alert('Error saving lead: ' + error.message);
    }
});

// --- UI Helpers ---
function toggleMobileMenu() {
    document.getElementById('sidebar').classList.toggle('mobile-open');
    document.getElementById('mobile-overlay').classList.toggle('hidden');
}

async function logout() {
    await supabase.auth.signOut();
    window.location.href = 'login.html';
}

checkAuth();
</script>
</body>
</html>
