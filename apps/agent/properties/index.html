<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Properties</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body class="bg-gray-50">

<div id="auth-loader">Loading...</div>

<header class="p-4 bg-white shadow flex justify-between">
  <h1 class="font-bold text-xl">My Properties</h1>

  <a href="create.html" class="bg-yellow-500 text-white px-4 py-2 rounded">
    + Add Property
  </a>
</header>

<div class="p-4 flex gap-3">
  <input id="search" placeholder="Search..." class="border p-2 w-full">
  <select id="status" class="border p-2">
    <option value="all">All</option>
    <option value="available">Available</option>
    <option value="pending">Pending</option>
    <option value="sold">Sold</option>
  </select>
</div>

<div id="grid" class="p-4 grid grid-cols-1 md:grid-cols-3 gap-4"></div>

<script>
const supabase = window.supabase.createClient(
  "https://nqwvsmuvltbiekfnvovx.supabase.co",
  "YOUR_ANON_KEY"
);

let user = null;
let properties = [];

async function auth() {
  const { data } = await supabase.auth.getUser();
  user = data.user;

  if (!user) {
    window.location.href = "../auth/login.html?role=agent";
  }

  load();
}

async function load() {
  const { data } = await supabase
    .from("properties")
    .select("*")
    .eq("agent_id", user.id)
    .order("created_at", { ascending: false });

  properties = data || [];
  render(properties);

  document.getElementById("auth-loader").style.display = "none";
}

function render(list) {
  const grid = document.getElementById("grid");

  if (!list.length) {
    grid.innerHTML = "<p>No properties</p>";
    return;
  }

  grid.innerHTML = list.map(p => `
    <div class="bg-white p-4 rounded shadow">
      <h2 class="font-bold">${p.title}</h2>
      <p>KES ${p.price}</p>
      <p class="text-sm text-gray-500">${p.status}</p>

      <div class="flex gap-2 mt-3">
        <a href="edit.html?id=${p.id}" class="text-blue-600">Edit</a>
        <button onclick="removeProp('${p.id}')" class="text-red-600">Delete</button>
      </div>
    </div>
  `).join("");
}

async function removeProp(id) {
  await supabase.from("properties")
    .delete()
    .eq("id", id)
    .eq("agent_id", user.id);

  load();
}

document.getElementById("search").addEventListener("input", (e) => {
  const q = e.target.value.toLowerCase();
  render(properties.filter(p =>
    (p.title || "").toLowerCase().includes(q)
  ));
});

document.getElementById("status").addEventListener("change", (e) => {
  const val = e.target.value;
  if (val === "all") return render(properties);

  render(properties.filter(p => p.status === val));
});

auth();
</script>

</body>
</html>
