<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Properties</title>

<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50">

<div id="auth-loader" class="p-4 text-center text-gray-500">Loading...</div>

<header class="p-4 bg-white shadow flex justify-between">
  <h1 class="font-bold text-xl">My Properties</h1>

  <a href="create.html" class="bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600">
    + Add Property
  </a>
</header>

<div class="p-4 flex gap-3">
  <input id="search" placeholder="Search..." class="border p-2 w-full rounded">
  <select id="status" class="border p-2 rounded">
    <option value="all">All</option>
    <option value="available">Available</option>
    <option value="pending">Pending</option>
    <option value="sold">Sold</option>
  </select>
</div>

<div id="grid" class="p-4 grid grid-cols-1 md:grid-cols-3 gap-4"></div>

<!-- FIX: Import the global Supabase client and Auth system we built -->
<script type="module">
  import { supabase } from '/public/js/supabase.js';
  import { requireRole } from '/public/js/auth.js';

  let currentUser = null;
  let properties = [];

  async function init() {
    // FIX: Enforce that only agents or admins can access this page
    const auth = await requireRole(['agent', 'admin']);
    if (!auth) return; 
    
    currentUser = auth.user;
    await load();
  }

  async function load() {
    const { data, error } = await supabase
      .from("properties")
      .select("*")
      .eq("agent_id", currentUser.id)
      .eq("hard_deleted", false) // FIX: Only show active properties
      .order("created_at", { ascending: false });

    if (error) {
      console.error("Load error:", error);
      return;
    }

    properties = data || [];
    render(properties);

    document.getElementById("auth-loader").style.display = "none";
  }

  function render(list) {
    const grid = document.getElementById("grid");

    if (!list.length) {
      grid.innerHTML = "<p class='text-gray-500 col-span-3 text-center'>No properties found.</p>";
      return;
    }

    grid.innerHTML = list.map(p => `
      <div class="bg-white p-4 rounded shadow border border-gray-100">
        <h2 class="font-bold text-lg truncate">${p.title || 'Untitled'}</h2>
        <p class="text-green-600 font-semibold">KES ${(p.price || 0).toLocaleString()}</p>
        <p class="text-sm text-gray-500 capitalize">${p.status || 'unknown'}</p>

        <div class="flex gap-4 mt-3 border-t pt-3">
          <a href="edit.html?id=${p.id}" class="text-blue-600 hover:underline text-sm font-medium">Edit</a>
          <!-- FIX: Removed inline onclick. Using data-id for safe event delegation -->
          <button data-delete-id="${p.id}" class="text-red-600 hover:underline text-sm font-medium delete-btn">Delete</button>
        </div>
      </div>
    `).join("");
  }

  // FIX: Safe Event Delegation for Delete Buttons (Prevents XSS)
  document.getElementById("grid").addEventListener("click", async (e) => {
    const btn = e.target.closest(".delete-btn");
    if (!btn) return;

    const id = btn.dataset.deleteId;
    if (!confirm("Are you sure you want to delete this property?")) return;

    btn.disabled = true;
    btn.textContent = "Deleting...";

    // FIX: Instead of a hard DB delete (which breaks audit logs), 
    // we update the 'hard_deleted' flag in your schema.
    const { error } = await supabase
      .from("properties")
      .update({ hard_deleted: true, updated_at: new Date().toISOString() })
      .eq("id", id)
      .eq("agent_id", currentUser.id); // 🔒 Security: Ensure they own it

    if (error) {
      console.error("Delete error:", error);
      alert("Failed to delete property.");
      btn.disabled = false;
      btn.textContent = "Delete";
      return;
    }

    await load(); // Reload the list
  });

  // Search and Filter Logic (Kept exactly as you wrote it, just cleaned up)
  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.toLowerCase();
    render(properties.filter(p =>
      (p.title || "").toLowerCase().includes(q) || 
      (p.town || "").toLowerCase().includes(q)
    ));
  });

  document.getElementById("status").addEventListener("change", (e) => {
    const val = e.target.value;
    if (val === "all") return render(properties);
    render(properties.filter(p => p.status === val));
  });

  // Run init immediately
  init();
</script>

</body>
</html>
