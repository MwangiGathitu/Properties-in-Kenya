<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Properties in Kenya — Verified Homes</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f8f4eb;
      color: #1e293b;
    }
    header {
      background: #0a2540;
      color: white;
      padding: 1rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .logo {
      font-size: 1.6rem;
      font-weight: 700;
      text-decoration: none;
      color: white;
    }
    .agent-link {
      background: #0070f3;
      color: white;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      margin-left: auto;
    }
    .search-bar {
      flex: 1;
      max-width: 600px;
      background: white;
      border-radius: 50px;
      padding: 0.6rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .search-bar input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 1rem;
    }
    .tabs {
      display: flex;
      background: white;
      border-bottom: 1px solid #e2e8f0;
      margin-top: 1rem;
      max-width: 1200px;
      margin: 1rem auto 0;
    }
    .tab {
      padding: 1rem 1.5rem;
      cursor: pointer;
      font-weight: 500;
      border-bottom: 3px solid transparent;
    }
    .tab.active {
      border-bottom: 3px solid #0070f3;
      color: #0070f3;
    }
    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    #listings {
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
    }
    .card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      display: flex;
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-6px); }
    .card-image-container {
      position: relative;
      width: 380px;
      flex-shrink: 0;
    }
    .card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
    }
    .bookmark {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255,255,255,0.95);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.3rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .card-content {
      padding: 1.5rem;
      flex: 1;
    }
    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .card-price {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1e40af;
      margin-bottom: 0.8rem;
    }
    .card-meta {
      color: #475569;
      font-size: 0.95rem;
      line-height: 1.6;
    }
    .wa-btn {
      background: #25D366;
      color: white;
      padding: 0.8rem 1.4rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      margin-top: 1rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    /* Detail Modal */
    #detailModal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: white;
      max-width: 1100px;
      width: 95%;
      max-height: 95vh;
      overflow-y: auto;
      border-radius: 12px;
    }
    .modal-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .close-btn { font-size: 1.8rem; cursor: pointer; }
  </style>
</head>
<body>
<header>
  <div class="header-content">
    <a href="/" class="logo">🏡 Properties in Kenya</a>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search by location, title or area...">
      <button onclick="applyFilters()" style="background:#0070f3; color:white; border:none; padding:0.5rem 1rem; border-radius:50px; cursor:pointer;">Search</button>
    </div>
    <a href="/agent.html" class="agent-link">🏢 List Your Property</a>
  </div>
</header>

<div class="tabs" id="tabs">
  <div class="tab active" data-type="all">All</div>
  <div class="tab" data-type="for sale">For Sale</div>
  <div class="tab" data-type="for rent">For Rent</div>
  <div class="tab" data-type="for lease">For Lease</div>
  <div class="tab" data-type="project">Projects</div>
</div>

<div class="container">
  <div id="listings"></div>
</div>

<!-- Detail Modal -->
<div id="detailModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitle"></h2>
      <span class="close-btn" onclick="closeModal()">×</span>
    </div>
    <div style="display:flex; gap:2rem; padding:1.5rem;">
      <!-- Main Image + Thumbnails -->
      <div style="flex: 2;">
        <img id="mainImage" style="width:100%; border-radius:8px; max-height:480px; object-fit:cover;" alt="">
        <div id="thumbnails" style="display:flex; gap:8px; margin-top:12px; overflow-x:auto;"></div>
      </div>
      <!-- Property Info -->
      <div style="flex: 1;">
        <div id="modalPrice" style="font-size:2rem; font-weight:700; color:#1e40af; margin-bottom:1rem;"></div>
        <div id="modalMeta" style="font-size:1.1rem; color:#475569; margin-bottom:1.5rem;"></div>
        <p id="modalDescription" style="line-height:1.7; color:#334155;"></p>
        <a id="modalWA" href="#" target="_blank" class="wa-btn">💬 Chat on WhatsApp</a>
      </div>
    </div>
  </div>
</div>

<script>
  const supabaseUrl = "https://nqwvsmuvltbiekfnvovx.supabase.co";
  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xd3ZzbXV2bHRiaWVrZm52b3Z4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjU4MDAsImV4cCI6MjA5NjE0MTgwMH0.Xrc-bbAuWdvKSPHnVhTaLiQphV61xeYtDepWePqsrdo";
  const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

  let allProperties = [];
  let savedProperties = JSON.parse(localStorage.getItem("savedProperties") || "[]");

  async function loadProperties() {
    const { data } = await supabaseClient
      .from("properties")
      .select("*")
      .eq("approval_status", "approved")
      .order("created_at", { ascending: false });
    allProperties = data || [];
    renderListings(allProperties);
  }

  function renderListings(properties) {
    const container = document.getElementById("listings");
    container.innerHTML = "";

    properties.forEach(p => {
      const isSaved = savedProperties.includes(p.id);
      const card = document.createElement("div");
      card.className = "card";
      card.onclick = () => openDetail(p);

      const image = p.image_url || `https://picsum.photos/seed/${p.id}/600/400`;
      const price = p.price ? `KSh ${Number(p.price).toLocaleString()}` : "Price on request";

      card.innerHTML = `
        <div class="card-image-container">
          <img src="${image}" alt="${p.title}">
          <div class="bookmark" onclick="event.stopImmediatePropagation(); toggleSave('${p.id}')">${isSaved ? '❤️' : '♡'}</div>
        </div>
        <div class="card-content">
          <div class="card-title">${p.title || "Untitled"}</div>
          <div class="card-price">${price}</div>
          <div class="card-meta">
            📍 ${p.location || "N/A"}<br>
            ${p.property_type ? p.property_type.toUpperCase() : ""}
          </div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  window.toggleSave = function(id) {
    if (savedProperties.includes(id)) {
      savedProperties = savedProperties.filter(s => s !== id);
    } else {
      savedProperties.push(id);
    }
    localStorage.setItem("savedProperties", JSON.stringify(savedProperties));
    renderListings(allProperties);
  };

  window.openDetail = function(p) {
    document.getElementById("modalTitle").textContent = p.title || "Property Details";
    document.getElementById("modalPrice").textContent = p.price ? `KSh ${Number(p.price).toLocaleString()}` : "Price on request";
    document.getElementById("modalMeta").innerHTML = `
      📍 <strong>${p.location || "N/A"}</strong><br>
      Type: ${p.property_type || "—"}
    `;
    document.getElementById("modalDescription").textContent = p.description || "No description available.";

    const mainImg = document.getElementById("mainImage");
    mainImg.src = p.image_url || `https://picsum.photos/seed/${p.id}/800/500`;

    // Simple thumbnail (expandable later)
    const thumbs = document.getElementById("thumbnails");
    thumbs.innerHTML = `<img src="${mainImg.src}" style="width:80px; height:60px; object-fit:cover; border-radius:4px; cursor:pointer;" onclick="this.src='${mainImg.src}'; document.getElementById('mainImage').src=this.src">`;

    const waLink = `https://wa.me/254700000000?text=${encodeURIComponent(`Hi, I'm interested in ${p.title} in ${p.location}`)}`;
    document.getElementById("modalWA").href = waLink;

    document.getElementById("detailModal").style.display = "flex";
  };

  window.closeModal = function() {
    document.getElementById("detailModal").style.display = "none";
  };

  // Tabs
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const type = tab.getAttribute('data-type');
      const filtered = type === 'all' ? allProperties : allProperties.filter(p => 
        (p.property_type || "").toLowerCase().includes(type)
      );
      renderListings(filtered);
    });
  });

  // Search
  function applyFilters() {
    const term = document.getElementById("searchInput").value.toLowerCase().trim();
    const filtered = allProperties.filter(p => 
      !term || 
      (p.title || "").toLowerCase().includes(term) || 
      (p.location || "").toLowerCase().includes(term)
    );
    renderListings(filtered);
  }

  loadProperties();
</script>
</body>
</html>
