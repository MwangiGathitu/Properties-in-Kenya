<!DOCTYPE html>
<html>
<head>
  <title>Admin Control Room</title>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabaseUrl = "https://nqwvsmuvltbiekfnvovx.supabase.co";
    const supabaseKey = "YOUR_ANON_KEY";

    const supabase = createClient(supabaseUrl, supabaseKey);

    let allListings = [];
    let currentTab = "pending";

    // -------------------------
    // LOGIN (simple admin gate)
    // -------------------------
    const ADMIN_PASSWORD = "1234";

    window.login = function () {
      const input = document.getElementById("password").value;

      if (input !== ADMIN_PASSWORD) {
        alert("Wrong password");
        return;
      }

      document.getElementById("loginBox").style.display = "none";
      document.getElementById("adminPanel").style.display = "block";

      loadListings();
    };

    // -------------------------
    // LOAD DATA
    // -------------------------
    async function loadListings() {
      const { data, error } = await supabase
        .from("properties")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        console.error("Load error:", error);
        return;
      }

      allListings = data || [];
      render();
    }

    // -------------------------
    // TAB SWITCHING
    // -------------------------
    window.setTab = function (tab) {
      currentTab = tab;
      render();
    };

    // -------------------------
    // FILTER LOGIC
    // -------------------------
    function getFilteredData() {
      const search = document.getElementById("search").value.toLowerCase();
      const location = document.getElementById("locationFilter").value.toLowerCase();
      const maxPrice = document.getElementById("maxPrice").value;

      return allListings.filter(p => {
        // status filter
        if (currentTab !== "all" && p.approval_status !== currentTab) {
          return false;
        }

        // search filter
        if (search && !p.title?.toLowerCase().includes(search)) {
          return false;
        }

        // location filter
        if (location && !p.location?.toLowerCase().includes(location)) {
          return false;
        }

        // price filter
        if (maxPrice && Number(p.price) > Number(maxPrice)) {
          return false;
        }

        return true;
      });
    }

    // -------------------------
    // RENDER UI
    // -------------------------
    function render() {
      const container = document.getElementById("listings");
      container.innerHTML = "";

      const data = getFilteredData();

      if (data.length === 0) {
        container.innerHTML = "<p>No listings found.</p>";
        return;
      }

      data.forEach(p => {
        const card = document.createElement("div");

        card.style = `
          background:white;
          padding:12px;
          margin:10px 0;
          border-radius:10px;
          border-left:5px solid ${
            p.approval_status === "approved"
              ? "green"
              : p.approval_status === "rejected"
              ? "red"
              : "orange"
          };
        `;

        const price = p.price ? `KES ${Number(p.price).toLocaleString()}` : "N/A";

        card.innerHTML = `
          <h3>${p.title}</h3>
          <p>${p.location}</p>
          <p><b>${price}</b></p>
          <p>Status: <b>${p.approval_status}</b></p>

          <small>Agent: ${p.agent_id || "unknown"}</small>
          <br><br>

          <button onclick="approve('${p.id}')">Approve</button>
          <button onclick="reject('${p.id}')">Reject</button>
        `;

        container.appendChild(card);
      });
    }

    // -------------------------
    // APPROVE (WITH AUDIT)
    // -------------------------
    window.approve = async function (id) {
      await supabase
        .from("properties")
        .update({
          approval_status: "approved",
          approved_at: new Date().toISOString()
        })
        .eq("id", id);

      loadListings();
    };

    // -------------------------
    // REJECT (WITH AUDIT)
    // -------------------------
    window.reject = async function (id) {
      await supabase
        .from("properties")
        .update({
          approval_status: "rejected",
          rejected_at: new Date().toISOString()
        })
        .eq("id", id);

      loadListings();
    };

    // live filter updates
    window.addEventListener("input", render);
  </script>

  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      padding: 20px;
    }

    button {
      margin: 5px;
      padding: 6px 10px;
      cursor: pointer;
    }

    .tabs button {
      margin-right: 8px;
    }

    input {
      padding: 8px;
      margin: 5px;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
  <h2>Admin Login</h2>
  <input id="password" type="password" placeholder="Enter password" />
  <button onclick="login()">Login</button>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" style="display:none;">

  <h2>Admin Control Room</h2>

  <!-- TABS -->
  <div class="tabs">
    <button onclick="setTab('pending')">Pending</button>
    <button onclick="setTab('approved')">Approved</button>
    <button onclick="setTab('rejected')">Rejected</button>
    <button onclick="setTab('all')">All</button>
  </div>

  <!-- FILTERS -->
  <div>
    <input id="search" placeholder="Search title..." />
    <input id="locationFilter" placeholder="Location..." />
    <input id="maxPrice" placeholder="Max price..." />
  </div>

  <!-- LISTINGS -->
  <div id="listings"></div>

</div>

</body>
</html>
