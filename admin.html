<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f4f4f4;
    }

    .card {
      background: white;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    button {
      padding: 8px 12px;
      margin-right: 8px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
    }

    .approve { background: green; color: white; }
    .reject { background: red; color: white; }
  </style>
</head>

<body>

<h2>Admin Dashboard - Pending Properties</h2>

<div id="list"></div>

<script>
  // 🔥 YOUR SUPABASE DETAILS (FIXED)
  const supabaseUrl = "https://nqwvsmuvltbiekfnvovx.supabase.co";

  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xd3ZzbXV2bHRiaWVrZm52b3Z4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjU4MDAsImV4cCI6MjA5NjE0MTgwMH0.Xrc-bbAuWdvKSPnVhTaLiQphV61xeYtDepWePqsrdo";

  const client = supabase.createClient(supabaseUrl, supabaseKey);

  // Load pending properties
  async function loadProperties() {
    const { data, error } = await client
      .from('properties')
      .select('*')
      .eq('status', 'pending');

    if (error) {
      console.error(error);
      alert("Error loading properties");
      return;
    }

    const list = document.getElementById("list");
    list.innerHTML = "";

    data.forEach(prop => {
      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <h3>${prop.title}</h3>
        <p><b>Location:</b> ${prop.location}</p>
        <p><b>Price:</b> ${prop.price}</p>

        <button class="approve" onclick="updateStatus('${prop.id}', 'approved')">Approve</button>
        <button class="reject" onclick="updateStatus('${prop.id}', 'rejected')">Reject</button>
      `;

      list.appendChild(div);
    });
  }

  // Update status
  async function updateStatus(id, status) {
    const { error } = await client
      .from('properties')
      .update({ status: status })
      .eq('id', id);

    if (error) {
      console.error(error);
      alert("Update failed");
      return;
    }

    loadProperties();
  }

  loadProperties();
</script>

</body>
</html>
