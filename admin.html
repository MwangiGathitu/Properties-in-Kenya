<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabaseUrl = "https://nqwvsmuvltbiekfnvovx.supabase.co";

    const supabaseKey =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xd3ZzbXV2bHRiaWVrZm52b3Z4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjU4MDAsImV4cCI6MjA5NjE0MTgwMH0.Xrc-bbAuWdvKSPHnVhTaLiQphV61xeYtDepWePqsrdo";

    const supabase = createClient(supabaseUrl, supabaseKey);

    // =========================
    // AUTH + ADMIN CHECK
    // =========================
    async function init() {
      const {
        data: { user }
      } = await supabase.auth.getUser();

      if (!user) {
        window.location.href = "login.html";
        return;
      }

      const { data: profile, error } = await supabase
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .single();

      console.log("USER:", user);
      console.log("PROFILE:", profile);
      console.log("ERROR:", error);

      if (error || !profile || profile.role !== "admin") {
        alert("Access denied");
        await supabase.auth.signOut();
        window.location.href = "login.html";
        return;
      }

      document.getElementById("adminEmail").textContent = user.email;

      loadListings();
    }

    // =========================
    // LOAD LISTINGS
    // =========================
    async function loadListings() {
      const { data, error } = await supabase
        .from("properties")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        console.error(error);
        alert(error.message);
        return;
      }

      const pending = document.getElementById("pending");
      const approved = document.getElementById("approved");
      const rejected = document.getElementById("rejected");

      pending.innerHTML = "";
      approved.innerHTML = "";
      rejected.innerHTML = "";

      data.forEach((p) => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <h3>${p.title}</h3>
          <p>${p.location}</p>
          <p>Status: <b>${p.approval_status}</b></p>

          <button onclick="approve('${p.id}')">Approve</button>
          <button onclick="reject('${p.id}')">Reject</button>
        `;

        if (p.approval_status === "approved") {
          approved.appendChild(card);
        } else if (p.approval_status === "rejected") {
          rejected.appendChild(card);
        } else {
          pending.appendChild(card);
        }
      });
    }

    // =========================
    // ACTIONS
    // =========================
    window.approve = async function (id) {
      await supabase
        .from("properties")
        .update({ approval_status: "approved" })
        .eq("id", id);

      loadListings();
    };

    window.reject = async function (id) {
      await supabase
        .from("properties")
        .update({ approval_status: "rejected" })
        .eq("id", id);

      loadListings();
    };

    // Start app
    window.addEventListener("load", init);
  </script>

  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      padding: 20px;
    }

    .header {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
    }

    button {
      margin-right: 5px;
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      background: #0070f3;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="header">
  <h2>Property Moderation</h2>
  <div id="adminEmail"></div>
</div>

<h3>Pending</h3>
<div id="pending"></div>

<h3>Approved</h3>
<div id="approved"></div>

<h3>Rejected</h3>
<div id="rejected"></div>

</body>
</html>
