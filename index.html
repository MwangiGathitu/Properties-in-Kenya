<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Properties in Kenya — Verified Homes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, Arial, sans-serif;
  background: #f6f2ea;
  color: #1e293b;
}

/* HERO */
.hero {
  background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
              url('https://images.unsplash.com/photo-1505691723518-36a5ac3b2f7d') center/cover;
  padding: 4rem 1rem 3rem;
  color: white;
  text-align: center;
}
.hero h1 { font-size: 2.4rem; margin-bottom: 0.5rem; }
.search-box {
  margin-top: 1.5rem;
  display: flex;
  gap: 0.8rem;
  justify-content: center;
  flex-wrap: wrap;
}
.search-box input {
  padding: 14px 16px;
  width: 280px;
  border-radius: 8px;
  border: none;
  font-size: 1rem;
}
.search-box button {
  padding: 14px 24px;
  background: #16a34a;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
}

/* LISTINGS */
.container {
  max-width: 1200px;
  margin: auto;
  padding: 2rem 1rem;
}
.card {
  display: flex;
  background: white;
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 1.5rem;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
  cursor: pointer;
  transition: 0.2s;
}
.card:hover { transform: scale(1.02); }
.card img {
  width: 260px;
  object-fit: cover;
}
.card-body {
  padding: 1.2rem;
  flex: 1;
}
.badges {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.badge {
  font-size: 11px;
  padding: 4px 9px;
  border-radius: 20px;
  background: #eef2ff;
  color: #3730a3;
  font-weight: 500;
}
.price {
  font-size: 1.35rem;
  font-weight: bold;
  color: #1e40af;
  margin: 6px 0;
}
.meta { font-size: 13px; color: #475569; margin: 6px 0; }
.actions {
  margin-top: 12px;
  display: flex;
  gap: 10px;
}
.btn {
  padding: 10px 14px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-size: 13.5px;
  font-weight: 600;
}
.btn-primary { background: #16a34a; color: white; }
.btn-secondary { background: #7c3aed; color: white; }
.btn-outline { background: transparent; border: 2px solid #6b21a8; color: #6b21a8; }

/* MODAL */
#modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  justify-content: center;
  align-items: center;
  z-index: 3000;
}
.modal-box {
  background: white;
  width: 95%;
  max-width: 1100px;
  border-radius: 12px;
  overflow: hidden;
  max-height: 95vh;
  overflow-y: auto;
}
.modal-header {
  padding: 1rem 1.5rem;
  display: flex;
  justify-content: space-between;
  border-bottom: 1px solid #eee;
  align-items: center;
}
.modal-body {
  display: flex;
  flex-wrap: wrap;
  gap: 2rem;
  padding: 1.5rem;
}
.modal-left { flex: 2; min-width: 300px; }
.modal-right { flex: 1; min-width: 280px; }
.hero-img { width: 100%; border-radius: 10px; height: 420px; object-fit: cover; }

.gallery {
  display: flex;
  gap: 10px;
  margin-top: 12px;
  overflow-x: auto;
  padding-bottom: 8px;
}
.thumb {
  width: 90px;
  height: 70px;
  object-fit: cover;
  border-radius: 8px;
  cursor: pointer;
  border: 2px solid transparent;
}
.thumb.active { border-color: #6b21a8; }

.intel {
  background: #f1f5f9;
  padding: 14px;
  border-radius: 10px;
  margin: 15px 0;
  font-size: 14px;
}
</style>
</head>
<body>

<!-- HERO -->
<div class="hero">
  <h1>🏡 Properties in Kenya</h1>
  <p>The No.1 platform for verified property in Eastlands</p>
  <div class="search-box">
    <input id="mainSearch" placeholder="Search area e.g. Ruai, Kayole, Embakasi" />
    <button onclick="applyFilters()">Search</button>
  </div>
</div>

<!-- LISTINGS -->
<div class="container" id="listings"></div>

<!-- RICH DETAIL MODAL -->
<div id="modal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="m-title"></h3>
      <span class="close" onclick="closeModal()">×</span>
    </div>
    <div class="modal-body">
      <div class="modal-left">
        <img id="m-img" class="hero-img" alt="">
        <div id="gallery" class="gallery"></div>

        <h3 id="m-price" style="margin-top:12px; color:#1e40af;"></h3>
        <p id="m-desc" style="margin:12px 0; line-height:1.7;"></p>
        
        <div class="intel" id="m-intel"></div>
      </div>

      <div class="modal-right">
        <h4>Agent Contact</h4>
        <p><strong>John Mwangi</strong><br>Verified Agent • Replies in 1-2 hrs</p>
        
        <button onclick="alert('WhatsApp opened to agent')" class="btn btn-primary" style="width:100%; margin:12px 0;">
          💬 WhatsApp Agent
        </button>
        <button onclick="alert('Viewing request sent!')" class="btn btn-secondary" style="width:100%; margin:8px 0;">
          📅 Request Viewing
        </button>
        <button onclick="requestLocation(currentId)" class="btn btn-outline" style="width:100%;">
          🔓 Request Exact Location
        </button>
      </div>
    </div>
  </div>
</div>

<script>
const supabase = supabase.createClient(
  "https://nqwvsmuvltbiekfnvovx.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xd3ZzbXV2bHRiaWVrZm52b3Z4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjU4MDAsImV4cCI6MjA5NjE0MTgwMH0.Xrc-bbAuWdvKSPHnVhTaLiQphV61xeYtDepWePqsrdo"
);

let properties = [];
let savedProperties = JSON.parse(localStorage.getItem("savedProperties") || "[]");
let currentId = null;

async function load() {
  const { data } = await supabase
    .from("properties")
    .select("*")
    .eq("approval_status", "approved")
    .order("created_at", { ascending: false });
  properties = data || [];
  render(properties);
}

function render(list) {
  const container = document.getElementById("listings");
  container.innerHTML = "";

  list.forEach(p => {
    const price = Number(p.price || 0);
    const html = `
      <div class="card" onclick='openModal(${JSON.stringify(p)})'>
        <img src="${p.image_url || 'https://picsum.photos/400'}" />
        <div class="card-body">
          <div class="badges">
            <span class="badge">✅ Verified</span>
            <span class="badge">High Demand</span>
          </div>
          <h3>${p.title}</h3>
          <div class="price">KES ${price.toLocaleString()}</div>
          <div class="meta">
            📍 ${p.location || "Eastlands"} • 8% below market • 12 views
          </div>
          <div class="actions">
            <button class="btn btn-primary" onclick="event.stopImmediatePropagation(); requestLocation('${p.id}')">Request Location</button>
            <button class="btn btn-outline" onclick="event.stopImmediatePropagation(); toggleSave('${p.id}')">❤️ Save</button>
          </div>
        </div>
      </div>
    `;
    container.innerHTML += html;
  });
}

window.openModal = function(p) {
  currentId = p.id;
  document.getElementById("modal").style.display = "flex";
  document.getElementById("m-title").innerText = p.title;
  document.getElementById("m-img").src = p.image_url || 'https://picsum.photos/800';
  document.getElementById("m-price").innerText = "KES " + Number(p.price).toLocaleString();
  document.getElementById("m-desc").innerText = p.description || "Prime verified property ready for immediate viewing.";

  // Multiple Image Gallery
  const gallery = document.getElementById("gallery");
  gallery.innerHTML = `
    <img src="${p.image_url}" class="thumb active" onclick="changeImage(this)">
    <img src="https://picsum.photos/id/${p.id}1/600" class="thumb" onclick="changeImage(this)">
    <img src="https://picsum.photos/id/${p.id}2/600" class="thumb" onclick="changeImage(this)">
    <img src="https://picsum.photos/id/${p.id}3/600" class="thumb" onclick="changeImage(this)">
  `;

  document.getElementById("m-intel").innerHTML = `
    <b>Market Intelligence</b><br><br>
    Avg price in area: KES 14.2M<br>
    This listing: KES ${Number(p.price).toLocaleString()}<br>
    <span style="color:#16a34a;">● 8% below market value</span><br><br>
    Demand: High • 14 inquiries this week
  `;
};

window.changeImage = function(img) {
  document.getElementById("m-img").src = img.src;
  document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
  img.classList.add('active');
};

window.requestLocation = function(id) {
  alert(`✅ Location request sent for property #${id}!\nAgent will contact you shortly.`);
};

window.toggleSave = function(id) {
  if (savedProperties.includes(id)) {
    savedProperties = savedProperties.filter(s => s !== id);
  } else {
    savedProperties.push(id);
  }
  localStorage.setItem("savedProperties", JSON.stringify(savedProperties));
  alert("Property saved to Shortlist ❤️");
};

window.closeModal = function() {
  document.getElementById("modal").style.display = "none";
};

function applyFilters() {
  const term = document.getElementById("mainSearch").value.toLowerCase();
  const filtered = properties.filter(p => 
    !term || (p.title + " " + p.location).toLowerCase().includes(term)
  );
  render(filtered);
}

load();
</script>
</body>
</html>
