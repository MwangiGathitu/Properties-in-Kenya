<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f4f4f4;
    }

    .card {
      background: white;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 10px;
    }

    button {
      padding: 8px 10px;
      margin-right: 5px;
      cursor: pointer;
    }

    .approve { background: green; color: white; border: none; }
    .reject { background: red; color: white; border: none; }
  </style>
</head>

<body>

<h2>Admin Dashboard</h2>
<div id="status"></div>
<div id="list"></div>

<script>
  // 🔥 SUPABASE CONFIG (YOUR PROJECT)
  const supabaseUrl = "https://nqwvsmuvltbiekfnvovx.supabase.co";

  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xd3ZzbXV2bHRiaWVrZm52b3Z4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjU4MDAsImV4cCI6MjA5NjE0MTgwMH0.Xrc-bbAuWdvKSPnVhTaLiQphV61xeYtDepWePqsrdo";

  const client = supabase.createClient(supabaseUrl, supabaseKey);

  const statusBox = document.getElementById("status");

  function setStatus(msg) {
    statusBox.innerHTML = `<p><b>${msg}</b></p>`;
  }

  // 🔥 LOAD PROPERTIES
  async function loadProperties() {
    setStatus("Loading properties...");

    const { data, error } = await client
      .from('properties')
      .select('*')
      .eq('status', 'pending');

    if (error) {
      console.log("ERROR:", error);
      setStatus("ERROR: " + error.message);
      return;
    }

    setStatus("Loaded " + data.length + " properties");

    const list = document.getElementById("list");
    list.innerHTML = "";

    data.forEach(prop => {
      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <h3>${prop.title}</h3>
        <p>${prop.location}</p>
        <p>${prop.price}</p>

        <button class="approve" onclick="updateStatus('${prop.id}', 'approved')">Approve</button>
        <button class="reject" onclick="updateStatus('${prop.id}', 'rejected')">Reject</button>
      `;

      list.appendChild(div);
    });
  }

  // 🔥 UPDATE STATUS
  async function updateStatus(id, status) {
    const { error } = await client
      .from('properties')
      .update({ status })
      .eq('id', id);

    if (error) {
      console.log("UPDATE ERROR:", error);
      alert(error.message);
      return;
    }

    loadProperties();
  }

  loadProperties();
</script>

</body>
</html>
