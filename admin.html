<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f4f4f4;
    }

    .card {
      background: white;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 10px;
    }

    button {
      padding: 8px 12px;
      margin-right: 8px;
      border: none;
      cursor: pointer;
    }

    .approve { background: green; color: white; }
    .reject { background: red; color: white; }
  </style>
</head>

<body>

<h2>Admin Dashboard</h2>

<div id="status">Loading...</div>
<div id="list"></div>

<script>
  const supabaseUrl = "https://nqwvsmuvltbiekfnvovx.supabase.co";

  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xd3ZzbXV2bHRiaWVrZm52b3Z4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjU4MDAsImV4cCI6MjA5NjE0MTgwMH0.Xrc-bbAuWdvKSPHnVhTaLiQphV61xeYtDepWePqsrdo";

  const client = supabase.createClient(supabaseUrl, supabaseKey);

  const statusBox = document.getElementById("status");

  function setStatus(msg) {
    statusBox.innerText = msg;
  }

  // 🔥 LOAD ALL PROPERTIES (ADMIN ONLY)
  async function loadProperties() {
    setStatus("Loading properties...");

    const { data, error } = await client
      .from('properties')
      .select('*');

    if (error) {
      console.log(error);
      setStatus("ERROR: " + error.message);
      return;
    }

    setStatus("Loaded: " + data.length);

    const list = document.getElementById("list");
    list.innerHTML = "";

    data.forEach(prop => {
      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <h3>${prop.title}</h3>
        <p>${prop.location}</p>
        <p>${prop.price}</p>
        <p>Status: ${prop.approval_status}</p>

        <button class="approve" onclick="updateStatus('${prop.id}', 'approved')">Approve</button>
        <button class="reject" onclick="updateStatus('${prop.id}', 'rejected')">Reject</button>
      `;

      list.appendChild(div);
    });
  }

  async function updateStatus(id, status) {
    const { error } = await client
      .from('properties')
      .update({ approval_status: status })
      .eq('id', id);

    if (error) {
      alert(error.message);
      return;
    }

    loadProperties();
  }

  loadProperties();
</script>

</body>
</html>
