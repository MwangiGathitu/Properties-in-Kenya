let currentUser = null;
let currentConversationId = null;
let otherAgentId = null;
let messageChannel = null;

async function checkAuth() {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) { window.location.href = 'login.html'; return; }
    currentUser = user;
    loadConversations();
    loadNetworkAgents();
}

function formatTime(dateString) {
    const date = new Date(dateString);
    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function getTimeAgo(dateString) {
    const date = new Date(dateString);
    const now = new Date();
    const seconds = Math.floor((now - date) / 1000);
    if (seconds < 60) return 'Just now';
    if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
    if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
    return `${Math.floor(seconds / 86400)}d ago`;
}

// --- TABS ---
function switchTab(tab) {
    const chatsList = document.getElementById('chats-list');
    const networkList = document.getElementById('network-list');
    const tabChats = document.getElementById('tab-chats');
    const tabNetwork = document.getElementById('tab-network');

    if (tab === 'chats') {
        chatsList.classList.remove('hidden');
        networkList.classList.add('hidden');
        tabChats.className = 'flex-1 py-4 text-sm font-bold text-blue-600 border-b-2 border-blue-600';
        tabNetwork.className = 'flex-1 py-4 text-sm font-semibold text-gray-500 hover:text-gray-700';
    } else {
        chatsList.classList.add('hidden');
        networkList.classList.remove('hidden');
        tabNetwork.className = 'flex-1 py-4 text-sm font-bold text-blue-600 border-b-2 border-blue-600';
        tabChats.className = 'flex-1 py-4 text-sm font-semibold text-gray-500 hover:text-gray-700';
    }
}

// --- CONVERSATIONS ---
async function loadConversations() {
    const { data, error } = await supabase
        .from('conversations')
        .select(`
            id,
            participant_1,
            participant_2,
            messages (content, sender_id, created_at)
        `)
        .or(`participant_1.eq.${currentUser.id},participant_2.eq.${currentUser.id}`)
        .order('created_at', { ascending: false });

    if (error) { console.error(error); return; }

    const list = document.getElementById('chats-list');
    if (!data || data.length === 0) {
        list.innerHTML = '<div class="p-8 text-center text-gray-400 text-sm">No conversations yet.<br>Go to the Network tab to message an agent!</div>';
        return;
    }

    // Fetch other agent details for each conversation
    const conversationsWithDetails = await Promise.all(data.map(async (conv) => {
        const otherId = conv.participant_1 === currentUser.id ? conv.participant_2 : conv.participant_1;
        const { data: profile } = await supabase.from('profiles').select('full_name, agency').eq('id', otherId).single();
        
        const lastMsg = conv.messages && conv.messages.length > 0 
            ? conv.messages.sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0] 
            : null;

        return { ...conv, otherId, otherName: profile?.full_name || 'Unknown Agent', otherAgency: profile?.agency || '', lastMsg };
    }));

    list.innerHTML = conversationsWithDetails.map(conv => `
        <div onclick="openChat('${conv.id}', '${conv.otherId}', '${conv.otherName}')" class="p-4 border-b border-gray-100 hover:bg-gray-50 cursor-pointer transition flex items-center gap-3">
            <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-full flex items-center justify-center text-white font-bold flex-shrink-0">
                ${conv.otherName.charAt(0)}
            </div>
            <div class="flex-1 min-w-0">
                <div class="flex justify-between items-baseline mb-1">
                    <h4 class="font-bold text-gray-900 text-sm truncate">${conv.otherName}</h4>
                    ${conv.lastMsg ? `<span class="text-[10px] text-gray-400 flex-shrink-0">${getTimeAgo(conv.lastMsg.created_at)}</span>` : ''}
                </div>
                <p class="text-xs text-gray-500 truncate mb-1">${conv.otherAgency}</p>
                <p class="text-xs text-gray-600 truncate font-medium">
                    ${conv.lastMsg ? (conv.lastMsg.sender_id === currentUser.id ? 'You: ' : '') + (conv.lastMsg.content.substring(0, 30) + '...') : 'Start a conversation'}
                </p>
            </div>
        </div>
    `).join('');
}

// --- NETWORK DIRECTORY ---
async function loadNetworkAgents() {
    const { data, error } = await supabase
        .from('profiles')
        .select('id, full_name, agency, county, specialization, is_verified')
        .neq('id', currentUser.id)
        .eq('is_verified', true); // Only show verified agents

    if (error) { console.error(error); return; }

    const container = document.getElementById('agents-directory');
    if (!data || data.length === 0) {
        container.innerHTML = '<div class="text-center text-gray-400 py-8">No other verified agents found.</div>';
        return;
    }

    window.allAgents = data; // Store for search
    renderAgents(data);
}

function renderAgents(agents) {
    const container = document.getElementById('agents-directory');
    container.innerHTML = agents.map(agent => `
        <div class="bg-white p-4 rounded-xl border border-gray-100 flex items-center gap-3">
            <div class="w-12 h-12 bg-gray-200 rounded-full flex items-center justify-center text-gray-600 font-bold flex-shrink-0 relative">
                ${agent.full_name.charAt(0)}
                ${agent.is_verified ? '<i class="fas fa-check-circle absolute -bottom-1 -right-1 text-blue-500 bg-white rounded-full text-xs"></i>' : ''}
            </div>
            <div class="flex-1 min-w-0">
                <h4 class="font-bold text-gray-900 text-sm truncate">${agent.full_name}</h4>
                <p class="text-xs text-gray-500 truncate">${agent.agency || 'Independent'} • ${agent.county || 'Kenya'}</p>
                ${agent.specialization ? `<p class="text-[10px] text-amber-600 font-semibold mt-1"><i class="fas fa-star mr-1"></i>${agent.specialization}</p>` : ''}
            </div>
            <button onclick="startConversation('${agent.id}', '${agent.full_name}')" class="px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-lg hover:bg-blue-700 transition flex-shrink-0">
                Message
            </button>
        </div>
    `).join('');
}

document.getElementById('network-search').addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase();
    const filtered = window.allAgents.filter(a => 
        a.full_name.toLowerCase().includes(term) || 
        (a.county && a.county.toLowerCase().includes(term))
    );
    renderAgents(filtered);
});

// --- CHAT LOGIC ---
async function startConversation(otherId, otherName) {
    // Check if conversation exists
    const { data: existing } = await supabase
        .from('conversations')
        .select('id')
        .or(`and(participant_1.eq.${currentUser.id},participant_2.eq.${otherId}),and(participant_1.eq.${otherId},participant_2.eq.${currentUser.id})`)
        .single();

    let convId = existing?.id;

    if (!convId) {
        // Create new conversation
        const { data: newConv, error } = await supabase
            .from('conversations')
            .insert({ participant_1: currentUser.id, participant_2: otherId })
            .select()
            .single();
        
        if (error) { alert('Error starting chat'); return; }
        convId = newConv.id;
    }

    openChat(convId, otherId, otherName);
}

async function openChat(convId, agentId, agentName) {
    currentConversationId = convId;
    otherAgentId = agentId;

    // Mobile UI toggle
    if (window.innerWidth < 1024) {
        document.getElementById('left-pane').classList.add('mobile-chat-hidden');
        document.getElementById('right-pane').classList.remove('mobile-chat-hidden');
        document.getElementById('right-pane').classList.add('flex');
    }

    document.getElementById('chat-empty-state').classList.add('hidden');
    document.getElementById('chat-interface').classList.remove('hidden');
    document.getElementById('chat-interface').classList.add('flex');
    
    document.getElementById('chat-name').textContent = agentName;
    document.getElementById('chat-avatar').textContent = agentName.charAt(0);

    // Load messages
    await loadMessages();

    // Setup Realtime Subscription
    if (messageChannel) supabase.removeChannel(messageChannel);
    
    messageChannel = supabase
        .channel(`chat-${convId}`)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `conversation_id=eq.${convId}` }, payload => {
            appendMessage(payload.new);
            scrollToBottom();
        })
        .subscribe();
}

async function loadMessages() {
    const { data, error } = await supabase
        .from('messages')
        .select('*, properties(title, price, images)')
        .eq('conversation_id', currentConversationId)
        .order('created_at', { ascending: true });

    if (error) { console.error(error); return; }

    const area = document.getElementById('messages-area');
    area.innerHTML = ''; // Clear before loading
    
    data.forEach(msg => appendMessage(msg, false));
    scrollToBottom();

    // Mark as read
    await supabase
        .from('messages')
        .update({ is_read: true })
        .eq('conversation_id', currentConversationId)
        .neq('sender_id', currentUser.id)
        .eq('is_read', false);
}

function appendMessage(msg, animate = true) {
    const area = document.getElementById('messages-area');
    const isSent = msg.sender_id === currentUser.id;
    
    let propertyCard = '';
    if (msg.property_id && msg.properties) {
        const img = msg.properties.images && msg.properties.images[0] ? msg.properties.images[0] : 'https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=400';
        const price = new Intl.NumberFormat('en-KE', { style: 'currency', currency: 'KES', maximumFractionDigits: 0 }).format(msg.properties.price);
        propertyCard = `
            <div class="mt-2 bg-white rounded-lg overflow-hidden border border-gray-200 shadow-sm max-w-xs">
                <img src="${img}" class="w-full h-24 object-cover">
                <div class="p-2">
                    <p class="text-xs font-bold text-gray-800 truncate">${msg.properties.title}</p>
                    <p class="text-xs text-amber-600 font-semibold">${price}</p>
                </div>
            </div>
        `;
    }

    const html = `
        <div class="flex ${isSent ? 'justify-end' : 'justify-start'} ${animate ? 'animate-slide-up' : ''}">
            <div class="msg-bubble ${isSent ? 'msg-sent' : 'msg-received'} rounded-2xl px-4 py-2.5 shadow-sm">
                <p class="text-sm">${msg.content}</p>
                ${propertyCard}
                <p class="text-[10px] ${isSent ? 'text-blue-800' : 'text-gray-500'} text-right mt-1">${formatTime(msg.created_at)}</p>
            </div>
        </div>
    `;
    
    area.insertAdjacentHTML('beforeend', html);
}

function scrollToBottom() {
    const area = document.getElementById('messages-area');
    area.scrollTop = area.scrollHeight;
}

async function sendMessage() {
    const input = document.getElementById('message-input');
    const content = input.value.trim();
    if (!content || !currentConversationId) return;

    const { error } = await supabase
        .from('messages')
        .insert({
            conversation_id: currentConversationId,
            sender_id: currentUser.id,
            content: content,
            is_read: false
        });

    if (!error) {
        input.value = '';
        input.style.height = 'auto'; // Reset height
    }
}

// Auto-resize textarea
document.getElementById('message-input').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = (this.scrollHeight) + 'px';
});
document.getElementById('message-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

// --- SHARE PROPERTY ---
async function openSharePropertyModal() {
    document.getElementById('share-modal').classList.remove('hidden');
    const list = document.getElementById('share-properties-list');
    
    const { data } = await supabase
        .from('properties')
        .select('id, title, price, images')
        .eq('agent_id', currentUser.id)
        .order('created_at', { ascending: false })
        .limit(5);

    if (!data || data.length === 0) {
        list.innerHTML = '<p class="text-center text-gray-500 text-sm py-4">You have no properties to share yet.</p>';
        return;
    }

    list.innerHTML = data.map(prop => {
        const img = prop.images && prop.images[0] ? prop.images[0] : 'https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=400';
        const price = new Intl.NumberFormat('en-KE', { style: 'currency', currency: 'KES', maximumFractionDigits: 0 }).format(prop.price);
        return `
        <div onclick="shareProperty('${prop.id}')" class="flex items-center gap-3 p-3 border border-gray-200 rounded-xl hover:bg-amber-50 hover:border-amber-300 cursor-pointer transition">
            <img src="${img}" class="w-16 h-16 object-cover rounded-lg flex-shrink-0">
            <div class="flex-1 min-w-0">
                <p class="font-bold text-sm text-gray-900 truncate">${prop.title}</p>
                <p class="text-xs text-amber-600 font-semibold">${price}</p>
            </div>
            <i class="fas fa-share text-gray-400"></i>
        </div>`;
    }).join('');
}

async function shareProperty(propertyId) {
    const { error } = await supabase
        .from('messages')
        .insert({
            conversation_id: currentConversationId,
            sender_id: currentUser.id,
            content: "Check out this property I think might be a good match:",
            property_id: propertyId,
            is_read: false
        });

    if (!error) {
        closeShareModal();
    }
}

function closeShareModal() {
    document.getElementById('share-modal').classList.add('hidden');
}

function closeChatMobile() {
    document.getElementById('right-pane').classList.add('mobile-chat-hidden');
    document.getElementById('right-pane').classList.remove('flex');
    document.getElementById('left-pane').classList.remove('mobile-chat-hidden');
    currentConversationId = null;
    if (messageChannel) supabase.removeChannel(messageChannel);
}

function toggleMobileMenu() {
    document.getElementById('sidebar').classList.toggle('mobile-open');
    document.getElementById('mobile-overlay').classList.toggle('hidden');
}

async function logout() {
    await supabase.auth.signOut();
    window.location.href = 'login.html';
}

// Init
checkAuth();
