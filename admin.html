<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f5f5f5;
    }

    .card {
      background: white;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    button {
      padding: 8px 12px;
      margin-right: 5px;
      cursor: pointer;
    }

    .approve { background: green; color: white; border: none; }
    .reject { background: red; color: white; border: none; }
  </style>
</head>

<body>

<h2>Admin Dashboard - Pending Properties</h2>

<div id="list"></div>

<script>
  const supabaseUrl = "YOUR_SUPABASE_URL";
  const supabaseKey = "YOUR_SUPABASE_ANON_KEY";

  const client = supabase.createClient(supabaseUrl, supabaseKey);

  // Load pending properties
  async function loadProperties() {
    const { data, error } = await client
      .from('properties')
      .select('*')
      .eq('status', 'pending');

    if (error) {
      console.error(error);
      return;
    }

    const list = document.getElementById("list");
    list.innerHTML = "";

    data.forEach(prop => {
      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <h3>${prop.title}</h3>
        <p>${prop.location}</p>
        <p>Price: ${prop.price}</p>

        <button class="approve" onclick="updateStatus('${prop.id}', 'approved')">Approve</button>
        <button class="reject" onclick="updateStatus('${prop.id}', 'rejected')">Reject</button>
      `;

      list.appendChild(div);
    });
  }

  // Update property status
  async function updateStatus(id, status) {
    const { error } = await client
      .from('properties')
      .update({ status: status })
      .eq('id', id);

    if (error) {
      alert("Error updating status");
      console.error(error);
      return;
    }

    loadProperties();
  }

  loadProperties();
</script>

</body>
</html>
